<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ILANOVA · Admin</title>
<style>
:root{--bg:#0b0b12;--card:#171722;--mut:#9a9ab0;--acc:#ff2d95;--g:linear-gradient(135deg,#ff2d95,#7a3cff)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .15s,background .2s}
button:active{transform:scale(.95)}
input,textarea{font:inherit;color:#fff;background:#232333;border:1px solid #ffffff18;border-radius:12px;padding:11px;width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--acc)}
label{display:block;color:var(--mut);font-size:12px;margin:14px 0 5px}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}}
@keyframes sh{to{background-position:200% 0}}
aside{width:220px;flex:none;background:#10101a;padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;border-right:1px solid #ffffff10}
.brand{font-weight:900;letter-spacing:3px;font-size:20px;padding:4px 10px 16px;background:linear-gradient(90deg,#ff2d95,#7a3cff,#00c2ff,#ff2d95);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
aside small{color:var(--mut);padding:0 10px;display:block;margin-top:-12px;margin-bottom:12px}
.nv{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;color:var(--mut);text-align:left;font-weight:600}
.nv:hover{background:#ffffff0d;color:#fff}.nv.on{background:var(--g);color:#fff;box-shadow:0 6px 24px #ff2d9540}
main{flex:1;padding:24px;max-width:960px;position:relative;overflow:hidden}
.orb{position:fixed;width:360px;height:360px;border-radius:50%;filter:blur(90px);opacity:.18;background:#7a3cff;right:-100px;top:-80px;animation:fl 10s infinite;pointer-events:none}
.view{display:none}.view.on{display:block;animation:fu .5s}
h1{font-size:26px;margin-bottom:4px}.sub{color:var(--mut);margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.st{background:var(--card);border-radius:18px;padding:18px;animation:fu .6s both;animation-delay:calc(var(--i)*80ms);transition:transform .25s}
.st:hover{transform:translateY(-4px)}
.st b{display:block;font-size:32px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}.st span{color:var(--mut);font-size:13px}
.box{background:var(--card);border-radius:18px;padding:18px;margin-top:14px}
.btn{background:#fff;color:#111;font-weight:700;padding:11px 20px;border-radius:30px;display:inline-flex;gap:8px;align-items:center}
.btn.g{background:var(--g);color:#fff}.btn.alt{background:#ffffff1f;color:#fff}.btn.red{background:#ff3b5c;color:#fff}
.ib{width:36px;height:36px;border-radius:50%;color:var(--mut);display:inline-grid;place-items:center}.ib:hover{background:#ffffff18;color:#fff}
.drop{border:2px dashed #ffffff30;border-radius:20px;padding:34px 16px;text-align:center;color:var(--mut);transition:.25s;cursor:pointer}
.drop.ov,.drop:hover{border-color:var(--acc);background:#ff2d9512;color:#fff;transform:scale(1.01)}
.drop .ic{font-size:34px;margin-bottom:8px;color:var(--acc)}
.tr{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid #ffffff0d;animation:fu .4s both;animation-delay:calc(var(--i)*40ms)}
.th{width:46px;height:46px;border-radius:10px;background:#2a2a3a center/cover;flex:none}
.tr .i{flex:1;min-width:0}.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s{color:var(--mut);font-size:12px}
.bd{font-size:11px;padding:3px 9px;border-radius:20px;background:#ffffff14;color:var(--mut)}.bd.ok{background:#1fd17d2a;color:#3be58f}.bd.no{background:#ff3b5c2a;color:#ff7088}
.ring{width:130px;height:130px;flex:none}.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bgc{stroke:#ffffff12}.ring .fg{stroke:url(#rg);stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1);transform:rotate(-90deg);transform-origin:50% 50%}
.fx{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:#000b;z-index:40;display:none;align-items:center;justify-content:center;padding:16px}#modal.on{display:flex}
.sheet{background:#1b1b28;width:100%;max-width:560px;border-radius:24px;padding:22px;max-height:90vh;overflow:auto;animation:fu .3s}
.chk{display:flex;gap:10px;align-items:center;padding:8px 4px;cursor:pointer}.chk input{width:auto}
.acts{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.lg{width:120px;height:80px;border-radius:14px;background:#2a2a3a center/contain no-repeat;margin-top:6px}
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-90px);background:#fff;color:#111;padding:10px 18px;border-radius:30px;z-index:60;transition:transform .4s;font-weight:600;font-size:14px}#toast.on{transform:translate(-50%,0)}
ol{padding-left:20px;line-height:1.9;color:#d5d5e5}
select{font:inherit;color:#fff;background:#232333;border:1px solid #ffffff18;border-radius:12px;padding:11px;width:100%;outline:0}
input[type=range]{padding:0;background:none;border:0;accent-color:#ff2d95}
.btn.sel{background:var(--g)!important;color:#fff!important}
#syl{position:relative;max-height:46vh;overflow:auto;background:#10101a;border-radius:14px;padding:12px;scrollbar-width:thin}
.sy-line{padding:6px 4px;font-size:21px;font-weight:800;line-height:1.35}
.sy-w{color:#ffffff4d;cursor:pointer;padding:0 2px;border-radius:5px;transition:color .12s}
.sy-w.done{color:#fff}.sy-w.next{color:#ff2d95;text-decoration:underline;text-underline-offset:5px}
.tapb{width:100%;height:110px;border-radius:20px;font-size:26px;font-weight:900;letter-spacing:3px;background:var(--g);color:#fff;margin-top:12px;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:0 10px 30px #ff2d9540}
.tapb:active{transform:scale(.97)}
#gate{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 20% 10%,#ff2d9533,transparent 50%),radial-gradient(circle at 80% 90%,#7a3cff44,transparent 50%),#07070d;display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .5s}
#gate.out{opacity:0;pointer-events:none}
#gbox{width:100%;max-width:340px;text-align:center;background:#171722;border-radius:24px;padding:28px 24px;box-shadow:0 20px 60px #000a;animation:fu .6s}
#gbox.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.sy-dots{display:flex;align-items:center;gap:8px;height:30px;opacity:0;transition:opacity .4s;margin-bottom:6px}.sy-dots.on{opacity:1}
.sy-dots i{width:12px;height:12px;border-radius:50%;background:#fff;opacity:.3;transition:transform .15s}.sy-dots .s{margin-left:6px}
@media(min-width:721px) and (max-width:1000px){aside{width:176px}main{padding:20px}.nv{padding:10px;font-size:14px}}
@media(min-width:1280px){main{max-width:1180px;padding:32px 40px}}
@media(max-width:720px){.tapb{height:96px}#syl{max-height:38vh}.acts{flex-wrap:wrap}.sheet{padding:18px}}
@media(max-width:720px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px}aside small,.brand{display:none}.nv{flex:none;padding:10px 12px;font-size:13px}main{padding:16px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d95"/><stop offset="1" stop-color="#7a3cff"/></linearGradient>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></symbol>
<symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4h6v2"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
<symbol id="i-sync" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
<symbol id="i-ext" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></symbol>
</defs></svg>
<i class="orb"></i>
<div id="gate"><div id="gbox"><div class="brand" style="padding:0 0 6px;font-size:30px">ILANOVA</div><p class="s" style="margin-bottom:18px;font-size:14px">Connexion à l’espace admin</p><input id="gem" type="email" placeholder="Adresse e-mail" autocomplete="username" style="margin-bottom:10px"><input id="gpw" type="password" placeholder="Mot de passe" autocomplete="current-password"><button class="btn g" id="gbtn" style="width:100%;justify-content:center;margin-top:12px">Entrer</button><div id="gerr" style="color:#ff7088;font-size:13px;margin-top:10px;min-height:18px"></div></div></div>
<aside>
 <div class="brand">ILANOVA</div><small>Espace admin</small>
 <button class="nv on" data-v="dash"><svg class="ic"><use href="#i-grid"/></svg>Tableau de bord</button>
 <button class="nv" data-v="tit"><svg class="ic"><use href="#i-disc"/></svg>Titres</button>
 <button class="nv" data-v="pl"><svg class="ic"><use href="#i-list"/></svg>Playlists</button>
 <button class="nv" data-v="sync"><svg class="ic"><use href="#i-sync"/></svg>Synchroniser</button>
 <button class="nv" data-v="news"><svg class="ic"><use href="#i-bell"/></svg>Actualités</button>
 <button class="nv" data-v="set"><svg class="ic"><use href="#i-set"/></svg>Paramètres</button>
 <button class="nv" data-v="pub"><svg class="ic"><use href="#i-dl"/></svg>Publier</button>
 <button class="nv" id="lock" style="margin-top:auto"><svg class="ic"><use href="#i-lock"/></svg>Verrouiller</button>
 <a class="nv" href="index.html" target="_blank" style="text-decoration:none"><svg class="ic"><use href="#i-ext"/></svg>Voir le site</a>
</aside>
<main>
 <section class="view on" id="v-dash"></section>
 <section class="view" id="v-tit">
  <h1>Titres</h1><p class="sub">Glisse tes MP3, tes fichiers .lrc et tes pochettes. Ils sont associés par le nom du fichier.</p>
  <div class="drop" id="drop"><svg class="ic"><use href="#i-up"/></svg><div><b>Glisse tes fichiers ici</b> ou touche pour choisir</div><div class="s" style="margin-top:6px">mon-son.mp3 + mon-son.lrc + mon-son.jpg = un titre complet</div></div>
  <input type="file" id="fi" multiple accept="audio/*,.lrc,image/*" hidden>
  <div class="fx" style="margin-top:14px"><input id="tq" placeholder="Rechercher un titre ou un artiste…" style="flex:1;min-width:160px"><select id="ts" style="width:auto"><option value="add">Ordre d’ajout</option><option value="recent">Plus récents</option><option value="az">A–Z</option><option value="art">Artiste</option><option value="nolrc">Sans paroles d’abord</option></select></div>
  <div class="box" id="tl"></div>
 </section>
 <section class="view" id="v-pl"></section>
 <section class="view" id="v-sync"></section>
 <section class="view" id="v-news"></section>
 <section class="view" id="v-set"></section>
 <section class="view" id="v-pub"></section>
</main>
<div id="modal"><div class="sheet" id="sheet"></div></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const fmt=s=>{s=Math.round(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const mb=n=>(n/1048576).toFixed(1)+' Mo';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove('on'),2600)}

/* mot de passe (empreinte SHA-256, le mot de passe n’est pas écrit dans le fichier) */
const PH='f47902687872c4eaab2c97b4e20da90228acd62b5c33846a1c928b7e0bfd91f9',SALT='ilanova-v2';
async function sha(s){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(SALT+s));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const gate=$('#gate');let okS=false;try{okS=sessionStorage.getItem('ilanova_ok2')==='1'}catch(e){}
if(okS)gate.style.display='none';
function lockLeft(){try{const f=JSON.parse(localStorage.getItem('ilanova_fail')||'{}');return Math.max(0,Math.ceil(((f.until||0)-Date.now())/1000))}catch(e){return 0}}
async function tryPw(){const e=$('#gerr');
  const L=lockLeft();if(L>0){e.textContent='Trop d’essais. Réessaie dans '+L+' s';return}
  if(!window.crypto||!crypto.subtle){e.textContent='Ouvre cette page en https pour te connecter.';return}
  const mail=$('#gem').value.trim().toLowerCase();
  await new Promise(r=>setTimeout(r,500));
  if(await sha(mail+'|'+$('#gpw').value)===PH){try{sessionStorage.setItem('ilanova_ok2','1');localStorage.removeItem('ilanova_fail')}catch(x){}gate.classList.add('out');setTimeout(()=>{gate.style.display='none'},500)}
  else{let f={n:0};try{f=JSON.parse(localStorage.getItem('ilanova_fail')||'{"n":0}')}catch(x){}f.n=(f.n||0)+1;
    if(f.n>=5){f.until=Date.now()+Math.min(3600,60*Math.pow(2,f.n-5))*1000}
    try{localStorage.setItem('ilanova_fail',JSON.stringify(f))}catch(x){}
    e.textContent=f.n>=5?'Trop d’essais. Réessaie dans '+lockLeft()+' s':'Adresse e-mail ou mot de passe incorrect';
    const b=$('#gbox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('#gpw').value=''}}
$('#gbtn').onclick=tryPw;$('#gpw').onkeydown=$('#gem').onkeydown=e=>{if(e.key==='Enter')tryPw()};
$('#lock').onclick=()=>{try{sessionStorage.removeItem('ilanova_ok2')}catch(e){}gate.style.display='flex';void gate.offsetWidth;gate.classList.remove('out');$('#gpw').value='';$('#gerr').textContent=''};

/* stockage (IndexedDB, partagé avec index.html si même site) */
let _db;const db=()=>_db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('ilanova',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const get=async k=>{const d=await db();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
const set=async(k,v)=>{const d=await db();return new Promise((r,j)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=()=>j(t.error)})};
const del=async k=>{const d=await db();return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=r})};
const U={};const url=async k=>U[k]||(await get(k).then(b=>b?(U[k]=URL.createObjectURL(b)):''));
const DEF={settings:{name:'ILANOVA',tagline:'Ta musique, sans limites.',artist:'Ilan',footer:'Créé avec Claude et Ilan, pour te soutenir dans ton travail de monstre',logoExt:''},tracks:[],playlists:[],news:[]};
let lib=JSON.parse(JSON.stringify(DEF));
const save=()=>set('lib',lib);
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30)||'titre';
const tById=id=>lib.tracks.find(t=>t.id===id);

/* navigation */
function show(v){if(window.syStop&&v!=='sync')syStop();$$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));$$('.nv[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render(v)}
$$('.nv[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));
const render=v=>({dash:rDash,tit:rTit,pl:rPl,news:rNews,sync:rSync,set:rSet,pub:rPub}[v||$('.view.on').id.slice(2)])();
const modal=h=>{$('#sheet').innerHTML=h;$('#modal').classList.add('on')};
const closeM=()=>$('#modal').classList.remove('on');
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};

/* tableau de bord */
function count(el,to){const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1000);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
function rDash(){
  const T=lib.tracks,dur=T.reduce((a,t)=>a+(t.duration||0),0),size=T.reduce((a,t)=>a+(t.size||0),0);
  const wl=T.filter(t=>t.lrcText).length,pct=T.length?Math.round(wl/T.length*100):0;
  const todo=T.filter(t=>!t.lrcText||!t.coverExt);
  $('#v-dash').innerHTML=`<h1>Bienvenue, ${esc(lib.settings.artist||'Ilan')}</h1><p class="sub">Voilà l’état de ton site.</p>
  <div class="grid">${[['Titres',T.length,''],['Minutes de musique',Math.round(dur/60),''],['Playlists officielles',lib.playlists.length,''],['Poids total',0,mb(size)]].map((s,i)=>`<div class="st" style="--i:${i}"><b data-n="${s[1]}">${s[2]||0}</b><span>${s[0]}</span></div>`).join('')}</div>
  <div class="box fx"><svg class="ring" viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="42"/><circle class="fg" id="rf" cx="50" cy="50" r="42"/></svg>
  <div><h2 style="font-size:20px">${pct}% avec paroles</h2><p class="s" style="margin:6px 0 14px">${wl} titre(s) sur ${T.length} ont un fichier .lrc</p><button class="btn g" data-go="tit">${I('up')} Ajouter des titres</button></div></div>
  <div class="box"><b>Stockage du navigateur</b><div class="s" id="stor" style="margin-top:6px">Calcul…</div></div>
  <div class="box"><h2 style="font-size:17px;margin-bottom:8px">À compléter</h2>${todo.length?todo.map(t=>`<div class="tr"><div class="i"><div class="t">${esc(t.title)}</div></div>${t.lrcText?'':'<span class="bd no">sans paroles</span>'}${t.coverExt?'':'<span class="bd no">sans pochette</span>'}<button class="ib" data-ed="${t.id}">${I('edit')}</button></div>`).join(''):'<div class="s">Tout est complet.</div>'}</div>`;

function syTapMode(v){sy.tap=v;$('#sy-mt').classList.toggle('sel',v);$('#sy-mp').classList.toggle('sel',!v);$('#sy-tap').style.opacity=v?1:.35;syTick()}

  $('#nadd').onclick=async()=>{const t=$('#n1').value.trim(),x=$('#n2').value.trim();if(!t&&!x){toast('Écris un titre ou un message');return}
    lib.news.push({id:'n'+Date.now().toString(36),date:new Date().toISOString(),title:t||'Actualité',text:x});await save();toast('Actualité ajoutée');rNews()};
  $$('#v-news [data-nd]').forEach(b=>b.onclick=async()=>{if(confirm('Supprimer cette actualité ?')){lib.news=lib.news.filter(n=>n.id!==b.dataset.nd);await save();rNews()}})}

/* import depuis un autre site ILANOVA ou un zip */
const MIME={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',flac:'audio/flac',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',svg:'image/svg+xml'};
const extOf=p=>(String(p).split('?')[0].split('.').pop()||'').toLowerCase();
async function importLib(L,getB,getT){
  const st=$('#imp-st'),say=m=>{if(st)st.textContent=m};const fresh=!lib.tracks.length;
  const blobOf=async p=>{if(!p)return null;const b=await getB(p);return b?new Blob([b],{type:MIME[extOf(p)]||b.type||''}):null};
  const T=L.tracks||[];let added=0,i=0,miss=0;
  for(const t of T){i++;say('Import '+i+'/'+T.length+' : '+t.title);if(tById(t.id))continue;
    const a=await blobOf(t.audio);if(!a){miss++;continue}
    const c=await blobOf(t.cover);let lrc=t.lrcText||'';if(!lrc&&t.lrc){try{lrc=await getT(t.lrc)||''}catch(e){}}
    await set('a:'+t.id,a);if(c)await set('c:'+t.id,c);
    lib.tracks.push({id:t.id,key:(t.title||'').toLowerCase().trim(),title:t.title,artist:t.artist||'',audioExt:extOf(t.audio),coverExt:c?extOf(t.cover):'',lrcText:lrc,duration:await dur(a),size:a.size});added++}
  for(const p of (L.playlists||[])){if(lib.playlists.some(x=>x.id===p.id))continue;const c=await blobOf(p.cover);if(c)await set('p:'+p.id,c);lib.playlists.push({id:p.id,name:p.name,desc:p.desc||'',ids:p.ids||[],coverExt:c?extOf(p.cover):''})}
  lib.news=lib.news||[];for(const n of (L.news||[])){if(!lib.news.some(x=>x.id===n.id))lib.news.push(n)}
  const s=L.settings||{};
  if(fresh)lib.settings={...lib.settings,name:s.name||lib.settings.name,tagline:s.tagline==null?lib.settings.tagline:s.tagline,footer:s.footer==null?lib.settings.footer:s.footer};
  if(s.logo&&!lib.settings.logoExt){const b=await blobOf(s.logo);if(b){await set('logo',b);delete U.logo;lib.settings.logoExt=extOf(s.logo)}}
  await save();say('');toast(added+' titre(s) importé(s)'+(miss?' · '+miss+' sans MP3 trouvé':''));render()}
async function importZip(file){
  if(!window.JSZip){toast('JSZip non chargé : vérifie ta connexion');return}
  try{const z=await JSZip.loadAsync(file);const jf=Object.keys(z.files).find(n=>/(^|\/)library\.json$/.test(n));
    if(!jf){toast('library.json introuvable dans ce zip');return}
    const pre=jf.slice(0,jf.length-'library.json'.length),L=JSON.parse(await z.file(jf).async('string'));
    await importLib(L,async p=>{const f=z.file(pre+p);return f?await f.async('blob'):null},async p=>{const f=z.file(pre+p);return f?await f.async('string'):''})
  }catch(e){toast('Import impossible : '+e.message)}}
async function importUrl(){
  let u=$('#imp-u').value.trim();if(!u){toast('Colle l’adresse de l’ancien site');return}
  if(!/^https?:\/\//.test(u))u='https://'+u;u=u.replace(/(index|admin)\.html$/,'');if(!u.endsWith('/'))u+='/';
  try{const r=await fetch(u+'library.json',{cache:'no-store'});if(!r.ok)throw new Error('library.json introuvable ('+r.status+')');const L=await r.json();
    await importLib(L,async p=>{const x=await fetch(u+p);return x.ok?await x.blob():null},async p=>{const x=await fetch(u+p);return x.ok?await x.text():''})
  }catch(e){toast('Import impossible : '+e.message)}}
const IMPHTML=`<div class="box"><b>Importer des titres</b><p class="s" style="margin:6px 0 0;line-height:1.5">Récupère ce que tu as déjà publié ailleurs (ancien site) ou un zip de publication. Les titres déjà présents ne sont pas écrasés.</p>
<label>Adresse de l’ancien site</label><input id="imp-u" placeholder="https://ilanmichelot-afk.github.io/ilansong/"><div style="margin-top:10px"><button class="btn g" id="imp-ub">Importer depuis cette adresse</button></div>
<label>Ou un zip de publication</label><input type="file" id="imp-z" accept=".zip"><div class="s" id="imp-st" style="margin-top:10px"></div></div>`;
function wireImport(){$('#imp-ub').onclick=importUrl;$('#imp-z').onchange=e=>{if(e.target.files[0])importZip(e.target.files[0]);e.target.value=''}}

/* publier */
function rPub(){
  $('#v-pub').innerHTML=`<h1>Publier sur Netlify</h1><p class="sub">Tes changements sont d’abord enregistrés dans ce navigateur (aperçu local sur index.html). Pour les mettre en ligne :</p>
  <div class="box"><ol><li>Clique sur le bouton ci-dessous : un fichier <b>ilanova-publication.zip</b> est téléchargé.</li><li>Dézippe-le : tu obtiens <b>library.json</b> et les dossiers <b>musiques</b>, <b>paroles</b>, <b>covers</b>.</li><li>Mets-les dans le même dossier que <b>index.html</b> et <b>admin.html</b>.</li><li>Glisse ce dossier sur <b>app.netlify.com/drop</b> (ou sur ton site, onglet Deploys).</li></ol>
  <div style="margin-top:16px"><button class="btn g" id="pb">${I('dl')} Générer la publication (${lib.tracks.length} titres)</button></div><div class="s" id="pst" style="margin-top:10px"></div></div>
  <div class="box"><b>Bon à savoir</b><p class="s" style="margin-top:6px;line-height:1.6">Les visiteurs voient seulement ce que tu as publié. Modifier admin.html chez quelqu’un d’autre ne change rien pour les autres, car tout est enregistré dans son propre navigateur.</p></div>`;
  $('#pb').onclick=publish;$('#v-pub').insertAdjacentHTML('beforeend',IMPHTML);wireImport()}
async function publish(){
  if(!window.JSZip){toast('JSZip non chargé : vérifie ta connexion');return}
  const st=$('#pst');st.textContent='Préparation…';
  const z=new JSZip(),s=lib.settings,L={settings:{name:s.name,tagline:s.tagline,footer:s.footer,logo:''},tracks:[],playlists:[],news:(lib.news||[]).map(n=>({id:n.id,date:n.date,title:n.title,text:n.text}))};
  for(const t of lib.tracks){const a=await get('a:'+t.id);if(!a)continue;const ap=`musiques/${t.id}.${t.audioExt}`;z.file(ap,a);
    let cp='',lp='';if(t.coverExt){const c=await get('c:'+t.id);if(c){cp=`covers/${t.id}.${t.coverExt}`;z.file(cp,c)}}
    if(t.lrcText){lp=`paroles/${t.id}.lrc`;z.file(lp,t.lrcText)}
    L.tracks.push({id:t.id,title:t.title,artist:t.artist,audio:ap,cover:cp,lrc:lp})}
  for(const p of lib.playlists){let cp='';if(p.coverExt){const c=await get('p:'+p.id);if(c){cp=`covers/pl-${p.id}.${p.coverExt}`;z.file(cp,c)}}
    L.playlists.push({id:p.id,name:p.name,desc:p.desc,ids:p.ids,cover:cp})}
  if(s.logoExt){const b=await get('logo');if(b){L.settings.logo='logo.'+s.logoExt;z.file(L.settings.logo,b)}}
  z.file('library.json',JSON.stringify(L,null,1));
  const blob=await z.generateAsync({type:'blob',compression:'STORE'},m=>{st.textContent='Création du zip… '+Math.round(m.percent)+'%'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ilanova-publication.zip';a.click();st.textContent='Terminé. Dézippe puis glisse le dossier sur Netlify.';toast('Publication prête')}

$('#tq').oninput=e=>{tf.q=e.target.value.toLowerCase().trim();rTit()};$('#ts').onchange=e=>{tf.s=e.target.value;rTit()};

  if(b.dataset.go)show(b.dataset.go);else if(b.dataset.ed)editTrack(b.dataset.ed);else if(b.dataset.del)delTrack(b.dataset.del);

(async()=>{try{const l=await get('lib');if(l)lib={...DEF,...l,settings:{...DEF.settings,...l.settings}}}catch(e){toast('Stockage du navigateur indisponible')}rDash()})();
</script>
