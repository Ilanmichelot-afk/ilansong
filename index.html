<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ILANOVA</title>
<style>
:root{--bg:#fff;--fg:#000;--mut:#8a8a8e;--card:#f2f2f7;--line:#0000001a;--bar:#fffffff2;--sheet:#fff;--red:#1ed760;--on:#000;--pc:#7a3cff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--fg:#fff;--mut:#b3b3b3;--card:#282828;--line:#ffffff1a;--bar:#000000f0;--sheet:#282828}}
:root[data-theme=dark]{--bg:#121212;--fg:#fff;--mut:#b3b3b3;--card:#282828;--line:#ffffff1a;--bar:#000000f0;--sheet:#282828}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .15s,background .2s}
button:active{transform:scale(.92)}
input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--red)}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
@keyframes fu{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-50px) scale(1.2)}}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
@keyframes sh{to{background-position:200% 0}}
.fu,.row,.card{animation:fu .55s both;animation-delay:calc(var(--i,0)*50ms)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:fl 9s ease-in-out infinite}
.o1{width:340px;height:340px;background:#ff2d95;top:-60px;left:-80px}
.o2{width:380px;height:380px;background:#7a3cff;bottom:-100px;right:-100px;animation-delay:-3s}
.o3{width:240px;height:240px;background:#00c2ff;top:40%;left:55%;animation-delay:-6s}
.sc{position:relative;padding:24px}
.sc img{max-width:220px;max-height:140px;animation:pu 3s infinite}
.brand{font-size:44px;font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#ff2d95,#7a3cff,#00c2ff,#ff2d95);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
.sc p{color:#9a9ab0;margin:10px 0 28px}
.cr{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;color:#ffffff80;font-size:12px;padding:0 20px}
.btn{background:#fff;color:#111;font-weight:700;padding:12px 22px;border-radius:30px;display:inline-flex;gap:8px;align-items:center}
.btn.big{padding:16px 46px;font-size:18px;background:linear-gradient(135deg,#ff2d95,#7a3cff);color:#fff;box-shadow:0 0 40px #ff2d9570;animation:pu 2s infinite}
.btn.red{background:var(--red);color:var(--on,#000)}.btn:disabled{opacity:.4}
.lnk{display:block;margin:16px auto 0;color:#9a9ab0;font-size:13px;text-decoration:underline}
/* app */
#app{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 18px 200px}
header{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px;min-height:44px}
header h1{font-size:26px;font-weight:800;letter-spacing:-.3px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header img{height:36px;max-width:90px;object-fit:contain;border-radius:8px;margin-left:10px}
.chip{font-size:11px;background:var(--card);padding:4px 10px;border-radius:20px;color:var(--mut);margin-right:8px}
.view{display:none}.view.on{display:block}
h2{font-size:22px;font-weight:700;margin:28px 0 12px;display:flex;justify-content:space-between;align-items:center}
.lab{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin:14px 0 6px}
.hero{position:relative;border-radius:16px;aspect-ratio:1.15/1;max-height:420px;width:100%;background-size:cover;background-position:center;overflow:hidden;display:flex;align-items:flex-end;cursor:pointer;color:#fff}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000c,#0000 55%)}
.hs{position:relative;z-index:1;padding:16px;display:flex;align-items:flex-end;justify-content:space-between;width:100%}
.hs h3{font-size:22px}.hs p{opacity:.8;font-size:14px}
.pbtn{width:46px;height:46px;border-radius:50%;background:#ffffff38;backdrop-filter:blur(14px);display:grid;place-items:center;font-size:20px}
.scr{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
.card{flex:none;width:150px;text-align:left;cursor:pointer;transition:transform .25s}
.card:hover{transform:translateY(-5px)}
.card .im{aspect-ratio:1;border-radius:6px;background-size:cover;background-position:center;margin-bottom:8px;box-shadow:0 6px 20px #0003}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair{display:flex;gap:12px;margin:16px 0}
.pair button{flex:1;background:var(--card);color:var(--red);font-weight:600;padding:14px;border-radius:12px;display:flex;gap:8px;justify-content:center;align-items:center}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:8px 4px;border-radius:10px;cursor:pointer}
.row::after{display:none}
.row:hover{background:var(--card)}
.row.on .t{color:var(--red)}
.cv{width:50px;height:50px;border-radius:4px;flex:none;background-size:cover;background-position:center}
.row .i{flex:1;min-width:0}
.ib{width:38px;height:38px;border-radius:50%;color:var(--mut);display:grid;place-items:center;font-size:20px;flex:none}
.ib:hover{background:var(--card)}
.eq{display:none;gap:2px;align-items:flex-end;height:16px;width:18px}.row.on .eq{display:flex}
.eq i{flex:1;background:var(--red);border-radius:2px;animation:eq .8s infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
body.pause .eq i{animation-play-state:paused}
.empty{color:var(--mut);padding:30px 6px;text-align:center;line-height:1.6}
.cr2{text-align:center;color:var(--mut);font-size:12px;margin-top:40px}
.back{color:var(--red);font-size:17px;display:inline-flex;align-items:center;gap:2px;padding:6px 0}
.pdt{display:flex;justify-content:space-between;align-items:center}
.pdc{text-align:left;margin:8px 0}.pdc .im{width:min(62%,260px);aspect-ratio:1;border-radius:14px;background-size:cover;background-position:center;margin:0 auto 14px;box-shadow:0 12px 36px #0004}
.pdc h1{font-size:24px}
.sbx{position:relative}.sbx .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}.sbx input{padding-left:38px;border:0}
.hbt{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:21px;color:var(--fg);background:var(--card);margin-left:8px;flex:none}
.hbt .dot{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--card);display:none}
.hbt.new .dot{display:block;animation:pu 1.4s infinite}
.news{padding:12px 0;border-bottom:1px solid var(--line)}.news b{display:block;font-size:17px}.news .s{margin:2px 0 6px}.news p{white-space:pre-wrap;line-height:1.45}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 4px #0002}
.srow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.tg{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:.25s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 1px 4px #0004}
.tg.on{background:var(--red)}.tg.on::after{left:23px}
.noblur #ly p{filter:none!important}
.noanim *,.noanim *::before,.noanim *::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.qt{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:6px;overflow:hidden;height:56px;cursor:pointer;animation:fu .5s both;animation-delay:calc(var(--i,0)*45ms);transition:background .2s,transform .15s}
.qt:hover{background:var(--line)}.qt:active{transform:scale(.97)}
.qt .cv{width:56px;height:56px;border-radius:0}
.qt .t{flex:1;min-width:0;font-size:13px;font-weight:700;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}
.qt .eq{display:none;margin-right:8px}.qt.on .eq{display:flex}.qt.on .t,.card.on .t{color:var(--red)}
.pb{display:flex;align-items:center;justify-content:space-between;margin:12px 0 6px}
.shb{font-size:26px;color:var(--mut);width:46px;height:46px;display:grid;place-items:center;border-radius:50%}.shb:hover{color:var(--fg)}
.bigplay{width:58px;height:58px;border-radius:50%;background:var(--red);color:var(--on,#000);display:grid;place-items:center;font-size:26px;box-shadow:0 6px 20px #0005}
.btg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bt{height:96px;border-radius:8px;padding:12px;font-weight:800;font-size:16px;color:#fff;overflow:hidden;cursor:pointer;animation:fu .5s both;animation-delay:calc(var(--i,0)*40ms)}
#mini .s{color:#ffffffb3}
/* mini + tabs */
#mini{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));max-width:744px;margin:auto;background:var(--bar);background:color-mix(in srgb,var(--pc) 88%,#000);color:#fff;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;box-shadow:0 6px 24px #0003;display:none;align-items:center;gap:8px;padding:7px 8px;cursor:pointer;overflow:hidden;animation:fu .45s;z-index:6}
#mini .i{flex:1;min-width:0}
#mini .ib{color:#fff;font-size:22px;width:40px}
#mini #mpb{position:absolute;left:0;bottom:0;height:2px;background:#fff;width:0}
#tabs{position:fixed;bottom:0;left:0;right:0;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);z-index:5}
#tabs button{flex:1;max-width:220px;padding:9px 0 8px;color:var(--mut);font-size:10px;font-weight:500}
#tabs button .ic{display:block;margin:0 auto 3px;font-size:24px}
#tabs button.on{color:var(--fg)}
/* lecteur plein écran */
#full{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;color:#fff;padding:calc(8px + env(safe-area-inset-top)) 24px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,var(--pc),#000 92%);transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#full.on{transform:none}
#full>*{position:relative;z-index:1;flex:none}
#full>#bgw{position:absolute;inset:0;z-index:0;will-change:transform}
#bgc{position:absolute;inset:-22%;background-size:cover;background-position:center;filter:blur(46px) saturate(1.8) brightness(.62);animation:bgm 22s ease-in-out infinite alternate;will-change:transform}
@keyframes bgm{0%{transform:rotate(0) scale(1.05)}100%{transform:rotate(16deg) scale(1.3) translate(3%,2%)}}
#bgb{position:absolute;inset:0;overflow:hidden}
#bgb i{position:absolute;border-radius:50%;opacity:.8;will-change:transform}
#bgb .k1{width:85%;height:65%;left:-25%;top:0;background:radial-gradient(closest-side,var(--c1,#ff2d95),transparent);animation:k1 11s ease-in-out infinite alternate}
#bgb .k2{width:95%;height:60%;right:-35%;top:28%;background:radial-gradient(closest-side,var(--c2,#7a3cff),transparent);animation:k2 14s ease-in-out infinite alternate}
#bgb .k3{width:80%;height:70%;left:10%;bottom:-25%;background:radial-gradient(closest-side,var(--c3,#00c2ff),transparent);animation:k3 17s ease-in-out infinite alternate}
@keyframes k1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(45%,25%) scale(1.35)}100%{transform:translate(15%,70%) scale(.9)}}
@keyframes k2{0%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-40%,30%) scale(.85)}100%{transform:translate(-15%,-20%) scale(1.3)}}
@keyframes k3{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30%,-35%) scale(1.3)}100%{transform:translate(-20%,-10%) scale(.9)}}
body.pause #bgc,body.pause #bgb i{animation-play-state:paused}
#full>#bgo{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,#0000 35%,#000b 100%)}
#full .orb{position:absolute;z-index:0;opacity:.4;width:320px;height:320px;background:var(--pc)}
#full .o2{filter:blur(80px) hue-rotate(60deg)}
.fbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px}.grab{display:block;width:42px;height:5px;border-radius:3px;background:#ffffff66}
.xbtn{width:38px;height:38px;border-radius:50%;background:#ffffff2e;color:#fff;display:grid;place-items:center;font-size:20px;flex:none}.xbtn:hover{background:#ffffff4d}
#mh{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
#mh .i{flex:1;min-width:0}#mh .s,#full .s{color:#ffffffb0}
#art{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#fcv{width:min(100%,46vh);aspect-ratio:1;border-radius:12px;box-shadow:0 20px 60px #000a;background-size:cover;background-position:center;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
body.pause #fcv{transform:scale(.84)}
#tt{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
#tt .i{flex:1;min-width:0}#ft{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#fa{font-size:18px;color:#ffffffa8}
#full .ib{color:#fff;background:#ffffff26;width:34px;height:34px;font-size:16px}
#ly,#ql{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none;mask-image:linear-gradient(transparent,#000 12%,#000 85%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 85%,transparent)}
#ly::-webkit-scrollbar,#ql::-webkit-scrollbar{display:none}
#ly::before,#ly::after{content:"";display:block;height:25vh}
#ly p{display:flex;flex-wrap:wrap;column-gap:.28em;font-size:var(--lys,28px);font-weight:700;line-height:1.18;color:#ffffff59;padding:9px 4px;opacity:.51;filter:blur(var(--b,0px));transition:opacity .2s cubic-bezier(.61,1,.88,1),filter .35s ease;cursor:pointer}
#ly p.past{opacity:.497}
#ly p.on{opacity:1}
#ly p.r{justify-content:flex-end;text-align:right}
#ly .w{display:block;color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(90deg,rgba(255,255,255,.85) var(--gp,-20%),rgba(255,255,255,.5) calc(var(--gp,-20%) + 20%));text-shadow:0 0 var(--tsr,4px) rgba(255,255,255,var(--tso,0));will-change:transform}
#ly p.on .w{background-image:linear-gradient(90deg,rgba(255,255,255,.95) var(--gp,-20%),rgba(255,255,255,.4) calc(var(--gp,-20%) + 20%))}
#ly .nl{display:block}
.dots{display:flex;gap:9px;padding:14px 4px;opacity:0;transition:opacity .5s}.dots.on{opacity:1}
.dots i{width:15px;height:15px;border-radius:50%;background:#fff;opacity:.35;will-change:transform}
#ly .nl{font-size:18px;font-weight:600;filter:none}
#ql .row:hover{background:#ffffff14}#ql .row::after{background:#ffffff1a}#ql .row.on .t{color:#fff}#ql .eq i{background:#fff}#ql .s{color:#ffffffa0}
#full:not([data-m=art]) #art,#full:not([data-m=art]) #tt,#full:not([data-m=art]) .vol{display:none}
#full:not([data-m=ly]) #ly{display:none}#full:not([data-m=q]) #ql{display:none}#full[data-m=art] #mh{display:none}
#sb{padding-top:8px}
input.sk{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;border:0;padding:0;margin:0}
.sk::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#fff var(--p,0%),#ffffff40 var(--p,0%))}
.sk::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-4px;box-shadow:0 1px 6px #0006}
.sk::-moz-range-track{height:6px;border-radius:3px;background:#ffffff40}.sk::-moz-range-progress{height:6px;border-radius:3px;background:#fff}
.sk::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
.tm{display:flex;justify-content:space-between;font-size:12px;color:#ffffffb0;margin-top:2px}
.ctl{display:flex;justify-content:center;align-items:center;gap:28px;padding:6px 0}
.ctl button{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff}
.ctl .pp{font-size:28px;width:72px;height:72px;background:#fff;color:#000}
.vol{display:flex;align-items:center;gap:10px;padding:4px 4px 10px;color:#ffffffb0}
.bot{display:flex;justify-content:space-around;padding-top:4px}
.bot button{width:52px;height:46px;border-radius:12px;font-size:24px;color:#ffffffb8;display:grid;place-items:center}
.bot button.on{background:#ffffff30;color:#fff}
/* modal */
#modal{position:fixed;inset:0;background:#0008;z-index:40;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--sheet);color:var(--fg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:fu .35s}
.sheet h3{margin-bottom:14px}.sheet label{display:block;color:var(--mut);font-size:12px;margin:12px 0 5px}
.sw{display:flex;gap:10px}.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw i.on{border-color:var(--fg)}
.cp{display:flex;gap:12px;align-items:center}.cp .im{width:70px;height:70px;border-radius:12px;background-size:cover;background-position:center;background-color:var(--card)}
.acts{display:flex;gap:10px;margin-top:20px}.acts .btn{flex:1;justify-content:center}.danger{background:#ff3b5c!important;color:#fff!important}
.sheet .btn.alt{background:var(--card);color:var(--fg)}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);background:#222;color:#fff;padding:10px 18px;border-radius:30px;z-index:60;transition:transform .4s;font-weight:600;font-size:14px}
#toast.on{transform:translate(-50%,0)}
.sheet input[type=range]{padding:0;background:none;border:0}
.seg.sm{margin-left:10px}.seg.sm button{padding:6px 10px;font-size:12px}
#ly{overflow-x:hidden}#ly .w{max-width:100%;overflow-wrap:anywhere}
.bot button{position:relative}#rep[data-n]::after{content:attr(data-n);position:absolute;font-size:9px;font-weight:800;left:50%;top:50%;margin:3px 0 0 6px}
#favb.on{color:var(--red)}
@media(min-width:700px){
 #app{max-width:1040px;padding-left:28px;padding-right:28px}
 header h1{font-size:32px}.qg{grid-template-columns:repeat(3,1fr)}
 .card{width:176px}.btg{grid-template-columns:repeat(3,1fr)}
 #modal{align-items:center}.sheet{border-radius:24px;max-width:600px}
 #mini{max-width:900px}
}
@media(min-width:1024px){
 #app{max-width:none;margin:0 0 0 232px;padding:22px 44px 140px}
 #tabs{top:0;bottom:0;right:auto;width:232px;flex-direction:column;justify-content:flex-start;gap:4px;padding:28px 12px;border-top:0;border-right:1px solid var(--line)}
 #tabs button{flex:none;max-width:none;display:flex;align-items:center;gap:14px;font-size:15px;font-weight:600;padding:12px 16px;border-radius:10px;text-align:left}
 #tabs button .ic{display:inline-block;margin:0;font-size:22px}
 #tabs button:hover{background:var(--card);color:var(--fg)}
 #mini{left:232px;right:0;bottom:0;max-width:none;margin:0;border-radius:0;padding:10px 16px;box-shadow:none}
 .card{width:196px}header h1{font-size:36px}#toast{left:calc(50% + 116px)}
}
@media(min-width:820px) and (orientation:landscape){
 #full{display:grid;grid-template-columns:minmax(320px,430px) 1fr;grid-template-rows:auto minmax(0,1fr) auto auto auto auto auto;column-gap:56px;padding-left:48px;padding-right:48px;grid-template-areas:"bar bar" "art ly" "tt ly" "sb ly" "ctl ly" "vol ly" "bot ly"}
 #full .fbar{grid-area:bar}#full #art{grid-area:art}#full #tt{grid-area:tt}#full #sb{grid-area:sb}#full .ctl{grid-area:ctl}#full .vol{grid-area:vol}#full .bot{grid-area:bot}
 #full #ly,#full #ql{grid-area:ly}
 #full #mh{display:none!important}

/* ===== compte : Liquid Glass ===== */
#toast{z-index:90}
#pbtn{width:auto;min-width:40px;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0}
#pbtn img,#pbtn .av{width:40px;height:40px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--red);color:var(--on,#000);font-weight:800;flex:none}
#pbtn .pn{display:none;font-size:13px;font-weight:600;padding:0 14px 0 8px;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:700px){#pbtn.has .pn{display:inline}}
@keyframes gpop{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
@keyframes gshine{0%{transform:translateX(-60%)}100%{transform:translateX(160%)}}
#auth{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(5,5,12,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);overflow:hidden}
#auth.on{display:flex;animation:fu .25s both}
.ao{position:absolute;border-radius:50%;filter:blur(64px);opacity:.8;animation:fl 12s ease-in-out infinite;pointer-events:none}
.ao.o1{width:280px;height:280px;background:var(--red);left:8%;top:14%}
.ao.o2{width:320px;height:320px;background:#7a3cff;right:6%;bottom:8%;animation-delay:-4s}
.ao.o3{width:220px;height:220px;background:#00c2ff;left:42%;top:52%;animation-delay:-8s}
.glass{position:relative;width:100%;max-width:420px;max-height:92vh;overflow:auto;border-radius:32px;padding:26px 22px 22px;color:#fff;scrollbar-width:none;
 background:linear-gradient(145deg,rgba(255,255,255,.27),rgba(255,255,255,.07) 55%,rgba(255,255,255,.15));
 -webkit-backdrop-filter:blur(34px) saturate(190%) brightness(1.08);backdrop-filter:blur(34px) saturate(190%) brightness(1.08);
 border:1px solid rgba(255,255,255,.34);
 box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.15),inset 0 0 44px rgba(255,255,255,.07),0 28px 80px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.25);
 animation:gpop .5s cubic-bezier(.2,1.2,.3,1) both}
.glass::-webkit-scrollbar{display:none}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 55% at 18% -8%,rgba(255,255,255,.42),transparent 56%);mix-blend-mode:screen}
.glass::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);animation:gshine 6s ease-in-out infinite;mix-blend-mode:screen}
.glass>*{position:relative;z-index:1}
.gx{position:absolute!important;top:14px;right:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);z-index:3}
.gx:hover{background:rgba(255,255,255,.28)}
.gcen{text-align:center;padding:4px 30px 14px}
.gbrand{font-size:26px;font-weight:900;letter-spacing:5px;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.gcen h3{font-size:22px;margin:10px 0 2px}.gsub{color:rgba(255,255,255,.75);font-size:14px}
.gav{width:88px;height:88px;border-radius:50%;object-fit:cover;margin:6px auto 4px;display:block;border:2px solid rgba(255,255,255,.55);box-shadow:0 8px 28px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.gav.ini{display:grid;place-items:center;font-size:36px;font-weight:800;background:var(--red);color:var(--on,#000)}
.gseg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 2px 8px rgba(0,0,0,.2);margin-bottom:14px}
.gseg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:16px;background:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 14px rgba(0,0,0,.25);transition:transform .38s cubic-bezier(.3,1.3,.5,1)}
.gseg[data-t=up] i{transform:translateX(100%)}
.gseg button{position:relative;padding:11px 0;font-weight:700;font-size:14px;color:rgba(255,255,255,.75);transition:color .2s}
.gseg button.on{color:#fff}
.gg{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:46px;border-radius:23px;background:#fff;color:#1f1f1f;border:1px solid #747775;font:500 14px/20px Roboto,"Helvetica Neue",Arial,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.28);transition:transform .15s,box-shadow .2s}
.gg:hover{box-shadow:0 8px 26px rgba(0,0,0,.38)}.gg:disabled{opacity:.6}
.gor{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.65);font-size:12px;margin:14px 0 2px}
.gor::before,.gor::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent)}
.gf{position:relative;display:block;margin-top:12px}
.gf .gi{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.75);display:grid;pointer-events:none}
.glass input{width:100%;padding:14px 14px 14px 44px;border-radius:18px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 2px 7px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.2);font-size:15px;outline:0;transition:border-color .2s,box-shadow .2s,background .2s}
.glass input::placeholder{color:rgba(255,255,255,.6)}
.glass input:focus{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.75);box-shadow:inset 0 2px 7px rgba(0,0,0,.18),0 0 0 4px rgba(255,255,255,.14)}
.gb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;padding:14px;border-radius:20px;font-weight:800;font-size:15px;color:var(--on,#000);
 background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 60%),color-mix(in srgb,var(--red) 82%,transparent);
 border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -2px 6px rgba(0,0,0,.12),0 10px 28px rgba(0,0,0,.3);transition:transform .15s,filter .2s}
.gb:hover{filter:brightness(1.08)}.gb:disabled{opacity:.6}
.gb.gl{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.06));margin-top:10px}
.gb.dng{color:#ffb4bf}
.gl2{text-align:right;margin-top:8px}
.glink{color:rgba(255,255,255,.85);font-size:13px;text-decoration:underline}
.gmsg{margin:12px 0 0;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.45;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.gmsg.err{background:rgba(255,59,92,.28);border-color:rgba(255,120,140,.6)}
.gmsg.ok{background:rgba(48,209,88,.26);border-color:rgba(120,230,150,.6)}
.gmsg.warn{background:rgba(255,159,10,.26);border-color:rgba(255,200,120,.6)}
.gchip{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px auto 4px;padding:9px 14px;border-radius:30px;font-size:13px;width:fit-content;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.gchip i{width:8px;height:8px;border-radius:50%;background:#9aa}.gchip.ok i{background:#30d158;box-shadow:0 0 10px #30d158}.gchip.wait i{background:#ff9f0a;animation:pu 1s infinite}.gchip.err i{background:#ff3b5c}
.gfine{margin:16px 6px 0;font-size:11.5px;line-height:1.5;color:rgba(255,255,255,.62);text-align:center}

function applyCfg(){

  // Application de la valeur du slider Liquid Glass
  const blurVal = cfg.glassBlur ?? 20;
  r.style.setProperty('--glass-blur', blurVal + 'px');
  r.style.setProperty('--glass-opacity', (blurVal / 120).toFixed(2));

  r.style.setProperty('--red', cfg.acc);

function idbGet(k){return new Promise(res=>{try{const r=indexedDB.open('ilanova',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onerror=()=>res();r.onsuccess=()=>{const q=r.result.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res()}}catch(e){res()}})}
async function load(){
  const loc=await idbGet('lib');
  if(loc&&loc.tracks&&loc.tracks.length){
    S.preview=true;S.set={...S.set,...loc.settings};
    const u=async k=>{const b=await idbGet(k);return b?URL.createObjectURL(b):''};
    S.tracks=(await Promise.all(loc.tracks.map(async t=>({id:t.id,title:t.title,artist:t.artist,src:await u('a:'+t.id),cover:t.coverExt?await u('c:'+t.id):'',lrc:t.lrcText||''})))).filter(t=>t.src);
    S.pls=await Promise.all((loc.playlists||[]).map(async p=>({...p,cover:p.coverExt?await u('p:'+p.id):''})));
    S.set.logo=loc.settings&&loc.settings.logoExt?await u('logo'):'';S.news=loc.news||[];
  }else{
    try{const l=await(await fetch('library.json',{cache:'no-store'})).json();S.set={...S.set,...l.settings};
      S.tracks=(l.tracks||[]).map(t=>({id:t.id,title:t.title,artist:t.artist,src:t.audio,cover:t.cover||'',lrc:'',lrcUrl:t.lrc||''}));S.pls=l.playlists||[];S.news=l.news||[]}catch(e){}
  }
}

function measureWords(ls){mcv.font='700 100px '+getComputedStyle(document.body).fontFamily;let m=0;const seen=new Set();for(const l of ls)for(const w of l.ws){if(seen.has(w.x))continue;seen.add(w.x);m=Math.max(m,mcv.measureText(w.x).width/100)}lyMaxWord=Math.max(2,m)}
function lysBounds(){const ly=$('#ly');let W=ly&&ly.clientWidth;if(!W)W=(innerWidth>=820&&innerWidth>innerHeight)?innerWidth-48-430-56-96:innerWidth-48;return{min:16,max:Math.max(20,Math.min(110,(W-14)/lyMaxWord/1.08))}}
function lysSize(){const b=lysBounds();return Math.round(b.min+(b.max-b.min)*cfg.lysp/100)}

function shrink(f){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,360/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};im.src=u})}

function act(a,el){
  const rw=el.closest('.row'),rid=rw&&rw.dataset.id;
  switch(a){
    case'pp':toggle();break;case'next':step(1);break;case'prev':if(au.currentTime>3)au.currentTime=0;else step(-1);break;
    case'shuf':shuf=!shuf;$('#shuf').classList.toggle('on',shuf);break;
    case'mode':setMode($('#full').dataset.m===el.dataset.m?'art':el.dataset.m);break;
    case'addcur':if(cur)trackMenu(cur);break;
    case'add':trackMenu(rid);break;
    case'rand':startRandom();break;
    case'playfeat':play(feat,CTX.all);break;
    case'playall':if(CTX.all&&CTX.all.length){shuf=false;$('#shuf').classList.remove('on');play(CTX.all[0],CTX.all)}break;
    case'openpl':openId=el.dataset.pl;show('pd');break;
    case'gopl':show('pl');break;
    case'playpl':{const l=CTX['pl'+openId];if(l.length){shuf=false;$('#shuf').classList.remove('on');play(l[0],l)}}break;
    case'randpl':{const l=CTX['pl'+openId];if(l.length){shuf=true;$('#shuf').classList.add('on');play(l[Math.floor(Math.random()*l.length)],l)}}break;
    case'newpl':plEditor(null,el.dataset.t);break;
    case'editpl':plEditor(plById(openId));break;

/* ressort amorti : c'est lui qui fait rebondir et trembler le mot */
const mkS=(x,f,z)=>({x,v:0,g:x,w:6.2832*f,z});
function stepS(s,dt){const n=Math.max(1,Math.ceil(dt/.008)),h=dt/n;for(let i=0;i<n;i++){s.v+=(-s.w*s.w*(s.x-s.g)-2*s.z*s.w*s.v)*h;s.x+=s.v*h}}
const calm=s=>Math.abs(s.v)<.02&&Math.abs(s.x-s.g)<.0008;
function drawW(w){const e=w.el;e.style.transform='translate3d(0,'+w.y.x.toFixed(4)+'em,0) scale('+w.s.x.toFixed(4)+')';
  e.style.setProperty('--tsr',(4+2*w.gl.x).toFixed(2)+'px');e.style.setProperty('--tso',Math.min(1,Math.max(0,w.gl.x*.35)).toFixed(3))}
function restW(w,sung){w.s.x=w.s.g=sung?1:.95;w.y.x=w.y.g=sung?0:.01;w.gl.x=w.gl.g=0;w.s.v=w.y.v=w.gl.v=0;w.gp=sung?100:-20;w.el.style.setProperty('--gp',w.gp+'%');drawW(w)}
function setLyrics(t){lines=parseLRC(t.lrc);li=-1;const ly=$('#ly');dotsArr=[];lyW=[];
  if(!lines.length)ly.innerHTML='<p class="nl">Pas de paroles pour ce titre.</p>';
  else{let h='';lines.forEach((l,i)=>{const pe=i?lines[i-1].e:0;
      if(i?l.t-pe>=5:l.t>2.5)h+='<div class="dots" data-g="'+(dotsArr.push({a:i?pe+.4:0,b:l.t-.25})-1)+'"><i></i><i></i><i></i></div>';
      h+='<p'+(l.right?' class="r"':'')+'>'+(l.x?l.ws.map(w=>'<span class="w">'+esc(w.x)+'</span>').join(''):'…')+'</p>'});
    ly.innerHTML=h}
  ly.scrollTop=0;lyP=[...ly.querySelectorAll('p')];
  if(lines.length){lyW=lyP.map((p,i)=>[...p.querySelectorAll('.w')].map((el,j)=>{const w=lines[i].ws[j];return{el,t:w.t,e:w.e,s:mkS(.95,.88,.64),y:mkS(.01,1.45,.4),gl:mkS(0,1.18,.56),gp:-20,aw:false}}));
    lyW.forEach(ws=>ws.forEach(w=>restW(w,false)))}
  dotsArr.forEach((d,k)=>{d.el=ly.querySelector('.dots[data-g="'+k+'"]');d.sp=[0,1,2].map(()=>({sc:mkS(.75,.7,.6),y:mkS(.01,1.25,.4),op:mkS(.35,1,.5)}))});
  lyP.forEach((p,i)=>p.onclick=()=>{if(lines[i])au.currentTime=lines[i].t});measureWords(lines);applyLys()}
function animLine(i,t,dt){let busy=false;const anim=cfg.anim;
  for(const w of lyW[i]){let p,st;
    if(t<w.t){p=0;st=0}else if(t>=w.e){p=1;st=2}else{p=(t-w.t)/((w.e-w.t)||1);st=1}
    w.s.g=cv01(SC,p);w.y.g=cv01(YO,p);w.gl.g=cv01(GL,p);
    const gp=st===0?-20:st===2?100:-20+120*p;
    if(Math.abs(gp-w.gp)>.05){w.gp=gp;w.el.style.setProperty('--gp',gp.toFixed(1)+'%')}
    if(anim){stepS(w.s,dt);stepS(w.y,dt);stepS(w.gl,dt)}else{w.s.x=w.s.g;w.y.x=w.y.g;w.gl.x=w.gl.g;w.s.v=w.y.v=w.gl.v=0}
    const aw=st===1||!calm(w.s)||!calm(w.y)||!calm(w.gl);
    if(aw||w.aw)drawW(w);w.aw=aw;if(aw)busy=true}
  return busy}
function lyTick(){
  if(!lines.length)return false;const now=performance.now(),dt=Math.min(.05,(now-lastT)/1000||.016),t=au.currentTime;lastT=now;
  for(const d of dotsArr){const show=t>=d.a&&t<d.b;d.el.classList.toggle('on',show);
    if(!(t>=d.a-.2&&t<d.b+1.5))continue;
    const pr=show?(t-d.a)/Math.max(.1,d.b-d.a)*3:0;
    [...d.el.children].forEach((c,k)=>{const q=d.sp[k],dp=show?Math.max(0,Math.min(1,pr-k)):0;
      q.sc.g=cv01(DSC,dp);q.y.g=cv01(DYO,dp);q.op.g=cv01(DOP,dp);stepS(q.sc,dt);stepS(q.y,dt);stepS(q.op,dt);
      c.style.transform='translateY(calc(var(--lys,28px)*'+q.y.x.toFixed(3)+')) scale('+q.sc.x.toFixed(3)+')';c.style.opacity=Math.max(0,Math.min(1,q.op.x)).toFixed(3)})}
  let n=-1;for(let i=0;i<lines.length;i++){if(lines[i].t<=t+.1)n=i;else break}
  if(n!==li){li=n;
    lyP.forEach((p,i)=>{p.classList.toggle('on',i===n);p.classList.toggle('past',i<n);p.style.setProperty('--b',Math.min(1.25*Math.abs(i-n),6.83).toFixed(2)+'px');
      if(Math.abs(i-n)>1&&lyW[i])for(const w of lyW[i])restW(w,i<n)});
    if(n>=0&&lyP[n]){const c=$('#ly');snapTo(lyP[n].offsetTop-c.clientHeight*.3)}else snapTo(0)}
  let busy=false;
  for(let i=Math.max(0,n-1);i<=Math.min(lines.length-1,n+1);i++)if(lyW[i]&&animLine(i,t,dt))busy=true;
  return busy}
/* défilement : la liste saute presque d'un coup (80 %), puis se pose en ~0,2 s */
let snapRAF=0;
function snapTo(y){const c=$('#ly');if(!c)return;cancelAnimationFrame(snapRAF);
  y=Math.max(0,Math.min(c.scrollHeight-c.clientHeight,y));const d=y-c.scrollTop;
  if(Math.abs(d)<2||!cfg.anim){c.scrollTop=y;return}
  c.scrollTop+=d*.8;const t0=performance.now();let last=t0;
  (function f(now){const dt=Math.min(50,now-last);last=now;const r=y-c.scrollTop;
    if(Math.abs(r)<.6||now-t0>450){c.scrollTop=y;return}
    c.scrollTop+=r*(1-Math.exp(-dt/48));snapRAF=requestAnimationFrame(f)})(t0)}
function lyLoop(){if(looping)return;looping=true;(function f(){const b=lyTick();fxTick();if(!au.paused||b)requestAnimationFrame(f);else looping=false})()}
/* le fond réagit aux basses : on analyse le son une fois (sans toucher à la lecture) */
const ENV={};let fxEnv=null,fxS=0;
function envFrom(d0,d1,sr){const fl=Math.floor(sr/30),n=Math.floor(d0.length/fl),bass=new Float32Array(n),al=1-Math.exp(-2*Math.PI*150/sr);let lp=0;
  for(let i=0;i<n;i++){let sb=0;for(let k=i*fl;k<(i+1)*fl;k++){const v=d1?(d0[k]+d1[k])*.5:d0[k];lp+=al*(v-lp);sb+=lp*lp}bass[i]=Math.sqrt(sb/fl)}
  const norm=a=>{const q=Array.from(a).sort((x,y)=>x-y),m=q[Math.floor(q.length*.97)]||1;for(let i=0;i<a.length;i++)a[i]=Math.min(1,a[i]/m)};
  norm(bass);const onset=new Float32Array(n);
  for(let i=0;i<n;i++){let m=0,c=0;for(let k=Math.max(0,i-8);k<i;k++){m+=bass[k];c++}m=c?m/c:0;onset[i]=Math.max(0,bass[i]-m*1.05)}
  norm(onset);return{bass,onset}}
async function analyze(t){
  if(ENV[t.id]!==undefined)return;ENV[t.id]=null;
  try{const buf=await(await fetch(t.src)).arrayBuffer();const AC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    let ctx;try{ctx=new AC(1,1,11025)}catch(e){ctx=new AC(1,1,22050)}
    const ab=await new Promise((res,rej)=>{const p=ctx.decodeAudioData(buf,res,rej);if(p&&p.catch)p.catch(rej)});
    ENV[t.id]=envFrom(ab.getChannelData(0),ab.numberOfChannels>1?ab.getChannelData(1):null,ab.sampleRate);
    if(cur===t.id)fxEnv=ENV[t.id]}catch(e){}}
function fxTick(){
  const bw=$('#bgw');if(!bw)return;
  const on=cfg.react&&cfg.anim&&fxEnv&&$('#full').classList.contains('on')&&!au.paused;
  if(!on){if(fxS!==0){fxS=0;bw.style.transform=''}return}
  const i=Math.min(fxEnv.bass.length-1,Math.max(0,Math.floor(au.currentTime*30))),b=fxEnv.bass[i],o=fxEnv.onset[i];
  fxS+=(o-fxS)*(o>fxS?.65:.12);
  bw.style.transform='translate('+((Math.random()-.5)*fxS*10).toFixed(1)+'px,'+((Math.random()-.5)*fxS*10).toFixed(1)+'px) scale('+(1+.03*b+.075*fxS).toFixed(3)+')'}
const hueOf=(r,g,b)=>{const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;return h<0?h+360:h};
function palette(im){const c=document.createElement('canvas');c.width=c.height=12;const x=c.getContext('2d');x.drawImage(im,0,0,12,12);const d=x.getImageData(0,0,12,12).data,px=[];
  for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);px.push({r,g,b,h:hueOf(r,g,b),w:((mx-mn)/(mx||1))*(1-Math.abs((mx+mn)/510-.5)*1.2)+.02})}
  px.sort((a,b)=>b.w-a.w);const out=[];
  for(const p of px){if(out.every(o=>{const dh=Math.abs(o.h-p.h);return Math.min(dh,360-dh)>35}))out.push(p);if(out.length===3)break}
  while(out.length<3)out.push(px[out.length]||{r:120,g:60,b:255});
  return out.map(p=>`rgb(${p.r},${p.g},${p.b})`)}
function accent(t){const R=document.documentElement.style,h=hue(t.title),set=(k,v)=>R.setProperty(k,v);
  set('--pc',`hsl(${h} 60% 36%)`);set('--c1',`hsl(${h} 80% 52%)`);set('--c2',`hsl(${(h+70)%360} 80% 48%)`);set('--c3',`hsl(${(h+200)%360} 75% 50%)`);
  if(t.cover){const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=1;const x=c.getContext('2d');x.drawImage(im,0,0,1,1);const d=x.getImageData(0,0,1,1).data;
    set('--pc',`rgb(${d[0]*.75|0},${d[1]*.75|0},${d[2]*.75|0})`);const P=palette(im);set('--c1',P[0]);set('--c2',P[1]);set('--c3',P[2])}catch(e){}};im.src=t.cover}}
function play(id,list,pos){
  const t=byId(id);if(!t)return;if(list&&list.length)queue=list;else if(!queue.includes(id))queue=S.tracks.map(x=>x.id);
  cur=id;au.src=t.src;au.defaultPlaybackRate=cfg.rate;au.playbackRate=cfg.rate;
  if(pos==null)au.play().catch(()=>{});else au.addEventListener('loadedmetadata',()=>{try{au.currentTime=pos}catch(e){}},{once:true});
  if(pos==null){hist=[id,...hist.filter(x=>x!==id)].slice(0,20);try{localStorage.setItem('ilanova_hist',JSON.stringify(hist))}catch(e){}plays[id]=(plays[id]||0)+1;try{localStorage.setItem('ilanova_plays',JSON.stringify(plays))}catch(e){}}
  fxEnv=ENV[id]||null;if(cfg.react&&cfg.anim&&ENV[id]===undefined)setTimeout(()=>{if(cur===id)analyze(t)},700);
  setLyrics(t);
  if(!t.lrc&&t.lrcUrl)fetch(t.lrcUrl).then(r=>r.ok?r.text():'').then(x=>{t.lrc=x;if(cur===id)setLyrics(t)}).catch(()=>{});
  $('#ft').textContent=$('#mht').textContent=$('#mt').textContent=t.title;
  $('#fa').textContent=$('#mha').textContent=$('#ma').textContent=t.artist;
  [$('#fcv'),$('#mcv'),$('#mhc'),$('#bgc')].forEach(e=>e.setAttribute('style',(e.id==='mcv'?'width:44px;height:44px;':'')+cv(t)));
  $('#mini').style.display='flex';accent(t);mark();updFav();if($('#full').dataset.m==='q')rQ();
  if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:S.set.name,artwork:t.cover?[{src:t.cover}]:[]});
    navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1));
    navigator.mediaSession.setActionHandler('play',()=>au.play());navigator.mediaSession.setActionHandler('pause',()=>au.pause());
    try{navigator.mediaSession.setActionHandler('seekto',d=>{if(d.seekTime!=null)au.currentTime=d.seekTime});navigator.mediaSession.setActionHandler('seekforward',()=>{au.currentTime+=10});navigator.mediaSession.setActionHandler('seekbackward',()=>{au.currentTime=Math.max(0,au.currentTime-10)})}catch(e){}}}
function updFav(){const b=$('#favb');if(!b)return;const f=cur&&isFav(cur);b.classList.toggle('on',!!f);b.querySelector('use').setAttribute('href',f?'#i-heartf':'#i-heart')}
function updRep(){const b=$('#rep');if(!b)return;b.classList.toggle('on',rep!==0);if(rep===2)b.setAttribute('data-n','1');else b.removeAttribute('data-n')}
function step(d){if(!queue.length)return;let n;
  if(shuf&&queue.length>1){do{n=queue[Math.floor(Math.random()*queue.length)]}while(n===cur)}
  else n=queue[(queue.indexOf(cur)+d+queue.length)%queue.length];play(n)}
function toggle(){if(!cur){startRandom();return}au.paused?au.play():au.pause()}
function startRandom(){if(!S.tracks.length)return;shuf=true;$('#shuf').classList.add('on');const a=S.tracks.map(t=>t.id);play(a[Math.floor(Math.random()*a.length)],a)}
au.onplay=au.onpause=()=>{const p=au.paused;document.body.classList.toggle('pause',p);$$('[data-act=pp] use').forEach(u=>u.setAttribute('href',p?'#i-play':'#i-pause'));if(!p)lyLoop();else{const bw=$('#bgw');if(bw)bw.style.transform='';fxS=0}};
au.onended=()=>{if(rep===2){au.currentTime=0;au.play();return}if(rep===0&&!shuf&&queue.indexOf(cur)===queue.length-1)return;step(1)};
au.onloadedmetadata=()=>{$('#du').textContent='-'+fmt(au.duration)};
const sk=$('#seek'),vl=$('#vol');
const paint=(e,v)=>e.style.setProperty('--p',v+'%');
sk.oninput=()=>{drag=true;paint(sk,sk.value);if(au.duration)au.currentTime=sk.value/100*au.duration};
sk.onchange=()=>{drag=false};
vl.oninput=()=>{au.volume=vl.value/100;paint(vl,vl.value)};paint(vl,100);
au.ontimeupdate=()=>{const t=au.currentTime,d=au.duration;$('#cu').textContent=fmt(t);
  const nw=Date.now();if(cur&&nw-lastSave>4000){lastSave=nw;try{localStorage.setItem('ilanova_last',JSON.stringify({id:cur,pos:t}))}catch(e){}if(d&&'mediaSession' in navigator){try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(t,d),playbackRate:au.playbackRate||1})}catch(e){}}}
  if(d){$('#du').textContent='-'+fmt(d-t);const p=t/d*100;$('#mpb').style.width=p+'%';if(!drag){sk.value=p;paint(sk,p)}}
  lyTick()};
au.onseeked=lyTick;

(async()=>{
  await load();const s=S.set;document.title=s.name;
  $('#hlogo').innerHTML=s.logo?`<img src="${esc(s.logo)}" alt="">`:'';newsDot();
  $('#cr2').textContent=s.footer||'';
  if(S.preview)$('#prev').style.display='';
  rnd=shuffleArr(S.tracks.map(t=>t.id));
  $('#ttl').textContent=greet();$('#q').oninput({target:$('#q')});
  rHome();updRep();applyLys();initAccount();
  const dm=location.hash.match(/#t=([\w-]+)/);
  if(dm&&byId(dm[1])){play(dm[1],null,0);toast('Appuie sur lecture pour écouter')}
  else if(cfg.resume){try{const L=JSON.parse(localStorage.getItem('ilanova_last')||'null');if(L&&byId(L.id))play(L.id,null,L.pos||0)}catch(e){}}
})();
