<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>ILANOVA</title>
<style>
:root{--bg:#0b0b12;--card:#171722;--mut:#9a9ab0;--acc:#ff2d95;--g:linear-gradient(135deg,#ff2d95,#7a3cff)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.9)}
input,textarea{font:inherit;color:#fff;background:#232333;border:1px solid #ffffff18;border-radius:12px;padding:12px;width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--acc)}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
@keyframes fu{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-50px) scale(1.2)}}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
@keyframes sh{to{background-position:200% 0}}
.fu,.row,.card{animation:fu .6s both;animation-delay:calc(var(--i,0)*55ms)}
#splash{position:fixed;inset:0;z-index:50;background:#07070d;display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .7s,transform .7s;overflow:hidden}
#splash.out{opacity:0;transform:scale(1.15);pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:fl 9s ease-in-out infinite}
.o1{width:340px;height:340px;background:#ff2d95;top:-60px;left:-80px}
.o2{width:380px;height:380px;background:#7a3cff;bottom:-100px;right:-100px;animation-delay:-3s}
.o3{width:240px;height:240px;background:#00c2ff;top:40%;left:55%;animation-delay:-6s}
.sc{position:relative;padding:24px}
.sc img{max-width:220px;max-height:140px;animation:pu 3s infinite}
.brand{font-size:44px;font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#ff2d95,#7a3cff,#00c2ff,#ff2d95);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
.sc p{color:var(--mut);margin:10px 0 28px}
.cr{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;color:#ffffff80;font-size:12px;padding:0 20px}
.btn{background:#fff;color:#111;font-weight:700;padding:12px 22px;border-radius:30px;display:inline-flex;gap:8px;align-items:center}
.btn.alt{background:#ffffff26;color:#fff;backdrop-filter:blur(10px)}
.btn.big{padding:16px 46px;font-size:18px;background:var(--g);color:#fff;box-shadow:0 0 40px #ff2d9570;animation:pu 2s infinite}
.btn:disabled{opacity:.4}
.lnk{display:block;margin:16px auto 0;color:var(--mut);font-size:13px;text-decoration:underline}
#app{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 190px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
header img{height:38px}header .brand{font-size:24px;letter-spacing:3px}
.chip{font-size:11px;background:#ffffff1c;padding:4px 10px;border-radius:20px;color:var(--mut)}
.view{display:none}.view.on{display:block}
h2{font-size:21px;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center}
.hero{position:relative;border-radius:24px;min-height:230px;background-size:cover;background-position:center;overflow:hidden;display:flex;align-items:flex-end}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000d,#0003)}
.hs{position:relative;z-index:1;padding:22px}
.hs small{color:#ffffffc0;text-transform:uppercase;letter-spacing:2px;font-size:11px}
.hs h1{font-size:30px;margin:4px 0}.hs p{color:#ffffffc0;margin-bottom:14px}
.hb{display:flex;gap:10px;flex-wrap:wrap}
.scr{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
.card{flex:none;width:140px;text-align:left;cursor:pointer;transition:transform .25s}
.card:hover{transform:translateY(-6px) scale(1.03)}
.card .im{aspect-ratio:1;border-radius:16px;background-size:cover;background-position:center;margin-bottom:8px;box-shadow:0 8px 24px #0006}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;cursor:pointer;transition:background .2s}
.row:hover,.row:active{background:var(--card)}
.row.on .t{color:var(--acc)}
.cv{width:52px;height:52px;border-radius:10px;flex:none;background-size:cover;background-position:center}
.row .i{flex:1;min-width:0}
.ib{width:38px;height:38px;border-radius:50%;color:var(--mut);display:grid;place-items:center;font-size:18px;flex:none}
.ib:hover{background:#ffffff18;color:#fff}
.eq{display:none;gap:2px;align-items:flex-end;height:16px;width:18px}.row.on .eq{display:flex}
.eq i{flex:1;background:var(--acc);border-radius:2px;animation:eq .8s infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
body.pause .eq i{animation-play-state:paused}
.empty{color:var(--mut);padding:30px 6px;text-align:center;line-height:1.6}
.cr2{text-align:center;color:var(--mut);font-size:12px;margin-top:40px}
.pd{display:flex;gap:16px;align-items:flex-end;margin:12px 0 16px}
.pd .im{width:130px;height:130px;border-radius:18px;background-size:cover;background-position:center;flex:none;box-shadow:0 10px 30px #0008}
.pd h1{font-size:26px}
#mini{position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:744px;margin:auto;background:#242434ee;backdrop-filter:blur(16px);border-radius:18px;display:none;align-items:center;gap:10px;padding:8px;cursor:pointer;animation:fu .5s}
#mini .i{flex:1;min-width:0}
#tabs{position:fixed;bottom:0;left:0;right:0;background:#0b0b12ee;backdrop-filter:blur(16px);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #ffffff14;z-index:5}
#tabs button{flex:1;max-width:220px;padding:12px 0 10px;color:var(--mut);font-size:11px;transition:color .2s}
#tabs button .ic{display:block;margin:0 auto 3px;font-size:22px}
#tabs button.on{color:var(--acc)}
#full{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,var(--acc),#0b0b12 80%);transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#full.on{transform:none}
#full>*{position:relative;z-index:1}
#full .orb{z-index:0;opacity:.35;width:300px;height:300px;background:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:center}
#fcv{width:min(54vw,230px);aspect-ratio:1;border-radius:20px;margin:8px auto;box-shadow:0 16px 60px #000a;background-size:cover;background-position:center;transition:transform .5s}
body:not(.pause) #fcv{animation:pu 3s infinite}body.pause #fcv{transform:scale(.88)}
#ft{text-align:center;font-size:20px;font-weight:800}#fa{text-align:center;color:#ffffffb0;margin-bottom:4px}
#ly{flex:1;overflow-y:auto;text-align:center;padding:28vh 0;mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent);scrollbar-width:none}
#ly::-webkit-scrollbar{display:none}
#ly p{font-size:26px;font-weight:800;color:#ffffff4d;padding:8px 6px;transition:all .4s;filter:blur(1.2px);cursor:pointer}
#ly p.on{color:#fff;transform:scale(1.08);filter:none;text-shadow:0 0 24px #fff6}
#ly .nl{font-size:16px;font-weight:500;filter:none}
input[type=range]{padding:0;background:none;border:0;accent-color:#fff;margin:8px 0 2px}
.tm{display:flex;justify-content:space-between;font-size:12px;color:#ffffffb0}
.ctl{display:flex;justify-content:space-around;align-items:center;margin-top:6px}
.ctl button{font-size:26px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center}
.ctl .pp{background:#fff;color:#111;font-size:28px;box-shadow:0 0 30px #fff5}
.ctl .on{color:var(--acc)}
#modal{position:fixed;inset:0;background:#000b;z-index:40;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:#1b1b28;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:fu .35s}
.sheet h3{margin-bottom:14px}.sheet label{display:block;color:var(--mut);font-size:12px;margin:12px 0 5px}
.sw{display:flex;gap:10px}.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw i.on{border-color:#fff}
.cp{display:flex;gap:12px;align-items:center}.cp .im{width:70px;height:70px;border-radius:14px;background-size:cover;background-position:center;background-color:#2a2a3a}
.acts{display:flex;gap:10px;margin-top:20px}.acts .btn{flex:1;justify-content:center}.danger{background:#ff3b5c!important;color:#fff!important}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);background:#fff;color:#111;padding:10px 18px;border-radius:30px;z-index:60;transition:transform .4s;font-weight:600;font-size:14px}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body class="pause">
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21" fill="currentColor"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19"/></symbol>
<symbol id="i-prev" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4" fill="currentColor"/><line x1="5" y1="19" x2="5" y2="5"/></symbol>
<symbol id="i-shuffle" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4h6v2"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></symbol>
<symbol id="i-dn" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
</defs></svg>

<div id="splash"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
<div class="sc"><div id="slogo"></div><p id="stag">Chargement…</p><button class="btn big" id="enter" disabled>Entrer</button><button class="lnk" id="silent">Entrer en silence</button></div>

<div id="app">
 <header><div id="hlogo"></div><span class="chip" id="prev" style="display:none">Aperçu local</span></header>
 <section class="view on" id="v-home"></section>
 <section class="view" id="v-search"><input id="q" placeholder="Rechercher un titre ou un artiste…" autocomplete="off"><div id="qr" style="margin-top:12px"></div></section>
 <section class="view" id="v-pl"></section>
 <section class="view" id="v-pd"></section>
 <div class="cr2" id="cr2"></div>
</div>

<div id="mini"><div class="cv" id="mcv"></div><div class="i"><div class="t" id="mt"></div><div class="s" id="ma"></div></div><button class="ib" data-act="pp" style="color:#fff;font-size:22px"><svg class="ic"><use href="#i-play"/></svg></button></div>
<nav id="tabs">
 <button class="on" data-v="home"><svg class="ic"><use href="#i-home"/></svg>Accueil</button>
 <button data-v="search"><svg class="ic"><use href="#i-search"/></svg>Recherche</button>
 <button data-v="pl"><svg class="ic"><use href="#i-list"/></svg>Playlists</button>
</nav>

<div id="full"><i class="orb o1"></i>
 <div class="top"><button class="ib" id="close" style="color:#fff;font-size:26px"><svg class="ic"><use href="#i-down"/></svg></button><span class="s" id="fbr"></span><span style="width:38px"></span></div>
 <div id="fcv"></div><div id="ft"></div><div id="fa"></div><div id="ly"></div>
 <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
 <div class="tm"><span id="cu">0:00</span><span id="du">0:00</span></div>
 <div class="ctl">
  <button id="shuf" data-act="shuf"><svg class="ic"><use href="#i-shuffle"/></svg></button>
  <button data-act="prev"><svg class="ic"><use href="#i-prev"/></svg></button>
  <button class="pp" data-act="pp"><svg class="ic"><use href="#i-play"/></svg></button>
  <button data-act="next"><svg class="ic"><use href="#i-next"/></svg></button>
  <button data-act="addcur"><svg class="ic"><use href="#i-plus"/></svg></button>
 </div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const hue=t=>{let h=0;for(const c of String(t))h=(h*31+c.charCodeAt(0))%360;return h};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove('on'),2200)}

let S={tracks:[],pls:[],set:{name:'ILANOVA',tagline:'Ta musique, sans limites.',footer:'',logo:''},preview:false};
let mine=[];try{mine=JSON.parse(localStorage.getItem('ilanova_pl')||'[]')}catch(e){}
const saveMine=()=>{try{localStorage.setItem('ilanova_pl',JSON.stringify(mine))}catch(e){toast('Stockage plein')}};
function idbGet(k){return new Promise(res=>{try{const r=indexedDB.open('ilanova',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onerror=()=>res();r.onsuccess=()=>{const q=r.result.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res()}}catch(e){res()}})}
async function load(){
  const loc=await idbGet('lib');
  if(loc&&loc.tracks&&loc.tracks.length){
    S.preview=true;S.set={...S.set,...loc.settings};
    const u=async k=>{const b=await idbGet(k);return b?URL.createObjectURL(b):''};
    S.tracks=(await Promise.all(loc.tracks.map(async t=>({id:t.id,title:t.title,artist:t.artist,src:await u('a:'+t.id),cover:t.coverExt?await u('c:'+t.id):'',lrc:t.lrcText||''})))).filter(t=>t.src);
    S.pls=await Promise.all((loc.playlists||[]).map(async p=>({...p,cover:p.coverExt?await u('p:'+p.id):''})));
    S.set.logo=loc.settings&&loc.settings.logoExt?await u('logo'):'';
  }else{
    try{const l=await(await fetch('library.json',{cache:'no-store'})).json();S.set={...S.set,...l.settings};
      S.tracks=(l.tracks||[]).map(t=>({id:t.id,title:t.title,artist:t.artist,src:t.audio,cover:t.cover||'',lrc:'',lrcUrl:t.lrc||''}));S.pls=l.playlists||[]}catch(e){}
  }
}
const byId=id=>S.tracks.find(t=>t.id===id);
const allPls=()=>[...S.pls.map(p=>({...p,official:true})),...mine];
const plById=id=>allPls().find(p=>p.id===id);
const bg=u=>u?`background-image:url('${u}')`:'';
const grad=(s,h)=>`background:linear-gradient(135deg,hsl(${h??hue(s)} 70% 50%),hsl(${((h??hue(s))+60)%360} 70% 28%))`;
const cv=t=>t.cover?bg(t.cover):grad(t.title);
const plCover=p=>p.cover||((byId((p.ids||[])[0])||{}).cover)||'';
const plStyle=p=>plCover(p)?bg(plCover(p)):grad(p.name,p.hue);
const CTX={};

function row(t,ctx,i,extra=''){return `<div class="row" data-id="${t.id}" data-ctx="${ctx}" style="--i:${i}"><div class="cv" style="${cv(t)}"></div><div class="i"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist)}</div></div><div class="eq"><i></i><i></i><i></i></div>${extra}<button class="ib" data-act="add" title="Ajouter à une playlist">${I('plus')}</button></div>`}
function plCard(p,i){return `<div class="card" data-act="openpl" data-pl="${p.id}" style="--i:${i}"><div class="im" style="${plStyle(p)}"></div><div class="t">${esc(p.name)}</div><div class="s">${p.official?'Playlist officielle':(p.ids||[]).length+' titre(s)'}</div></div>`}
let feat=null;
function rHome(){
  const f=byId(feat)||S.tracks[0];let h='';
  if(!f)h='<div class="empty">Aucune musique pour l’instant.<br>Ajoute-les depuis la page <b>admin.html</b>.</div>';
  else{CTX.all=S.tracks.map(t=>t.id);
    h=`<div class="hero fu" style="${cv(f)}"><div class="hs"><small>Au hasard pour toi</small><h1>${esc(f.title)}</h1><p>${esc(f.artist)}</p><div class="hb"><button class="btn" data-act="playfeat">${I('play')} Lire</button><button class="btn alt" data-act="rand">${I('shuffle')} Aléatoire</button></div></div></div>`;
    const P=allPls();if(P.length)h+=`<h2>Playlists</h2><div class="scr">${P.map(plCard).join('')}</div>`;
    h+=`<h2>Tous les titres</h2>`+S.tracks.map((t,i)=>row(t,'all',i)).join('')}
  $('#v-home').innerHTML=h;mark()}
function rPl(){
  let h=`<h2 style="margin-top:6px">Mes playlists <button class="btn" data-act="newpl">${I('plus')} Créer</button></h2>`;
  h+=mine.length?`<div class="scr" style="flex-wrap:wrap">${mine.map(plCard).join('')}</div>`:'<div class="empty">Crée ta première playlist : nom, photo, description, couleur.</div>';
  if(S.pls.length)h+=`<h2>Playlists officielles</h2><div class="scr" style="flex-wrap:wrap">${S.pls.map(p=>plCard({...p,official:true})).join('')}</div>`;
  $('#v-pl').innerHTML=h}
let openId=null;
function rPd(){
  const p=plById(openId);if(!p){show('pl');return}
  const ids=(p.ids||[]).filter(byId);CTX['pl'+p.id]=ids;
  let h=`<button class="btn alt" data-act="gopl">${I('back')} Retour</button><div class="pd"><div class="im" style="${plStyle(p)}"></div><div><h1>${esc(p.name)}</h1><div class="s">${esc(p.desc||'')}</div><div class="s">${ids.length} titre(s)</div></div></div>
  <div class="hb" style="margin-bottom:10px"><button class="btn" data-act="playpl">${I('play')} Lire</button><button class="btn alt" data-act="randpl">${I('shuffle')}</button>${p.official?'':`<button class="btn alt" data-act="editpl">${I('edit')} Modifier</button>`}</div>`;
  h+=ids.length?ids.map((id,i)=>row(byId(id),'pl'+p.id,i,p.official?'':`<button class="ib" data-act="mv" data-d="-1">${I('up')}</button><button class="ib" data-act="mv" data-d="1">${I('dn')}</button><button class="ib" data-act="rm">${I('trash')}</button>`)).join(''):'<div class="empty">Playlist vide. Ajoute des titres avec le bouton +.</div>';
  $('#v-pd').innerHTML=h;mark()}
function show(v){$$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===(v==='pd'?'pl':v)));
  if(v==='pl')rPl();if(v==='pd')rPd();if(v==='home')rHome();window.scrollTo(0,0)}
function mark(){$$('.row').forEach(r=>r.classList.toggle('on',r.dataset.id===cur))}
$$('#tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('#q').oninput=e=>{const q=e.target.value.toLowerCase().trim();const r=q?S.tracks.filter(t=>(t.title+' '+t.artist).toLowerCase().includes(q)):[];CTX.q=r.map(t=>t.id);$('#qr').innerHTML=r.length?r.map((t,i)=>row(t,'q',i)).join(''):`<div class="empty">${q?'Aucun résultat.':'Tape pour chercher.'}</div>`;mark()};

const modal=h=>{$('#sheet').innerHTML=h;$('#modal').classList.add('on')};
const closeM=()=>$('#modal').classList.remove('on');
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
function addMenu(id){
  modal(`<h3>Ajouter à une playlist</h3>`+mine.map(p=>`<div class="row" data-act="addto" data-pl="${p.id}" data-t="${id}"><div class="cv" style="${plStyle(p)}"></div><div class="i"><div class="t">${esc(p.name)}</div></div></div>`).join('')+`<div class="row" data-act="newpl" data-t="${id}"><div class="cv" style="background:#2a2a3a;display:grid;place-items:center">${I('plus')}</div><div class="i"><div class="t">Nouvelle playlist</div></div></div>`)}
const HUES=[330,270,200,150,40,0];
let ed=null;
function plEditor(p,addId){
  ed={p:p?{...p}:{id:'p'+Date.now(),name:'',desc:'',hue:330,cover:'',ids:addId?[addId]:[]},isNew:!p};
  modal(`<h3>${p?'Modifier la playlist':'Nouvelle playlist'}</h3><div class="cp"><div class="im" id="edim" style="${ed.p.cover?bg(ed.p.cover):grad('x',ed.p.hue)}"></div><div><input type="file" id="edf" accept="image/*" hidden><button class="btn alt" data-act="pick">Choisir une photo</button></div></div>
  <label>Nom</label><input id="edn" maxlength="40" value="${esc(ed.p.name)}" placeholder="Ma playlist">
  <label>Description</label><textarea id="edd" rows="2" maxlength="140">${esc(ed.p.desc)}</textarea>
  <label>Couleur (sans photo)</label><div class="sw">${HUES.map(h=>`<i data-act="hue" data-h="${h}" class="${h===ed.p.hue?'on':''}" style="background:hsl(${h} 70% 50%)"></i>`).join('')}</div>
  <div class="acts">${p?`<button class="btn danger" data-act="delpl">${I('trash')}</button>`:''}<button class="btn" data-act="savepl">Enregistrer</button></div>`);
  $('#edf').onchange=async e=>{const f=e.target.files[0];if(!f)return;ed.p.cover=await shrink(f);$('#edim').setAttribute('style',bg(ed.p.cover))}}
function shrink(f){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,360/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};im.src=u})}

function act(a,el){
  const rw=el.closest('.row'),rid=rw&&rw.dataset.id;
  switch(a){
    case'pp':toggle();break;case'next':step(1);break;case'prev':if(au.currentTime>3)au.currentTime=0;else step(-1);break;
    case'shuf':shuf=!shuf;$('#shuf').classList.toggle('on',shuf);break;
    case'addcur':if(cur)addMenu(cur);break;
    case'add':addMenu(rid);break;
    case'rand':startRandom();break;
    case'playfeat':play(feat,CTX.all);break;
    case'openpl':openId=el.dataset.pl;show('pd');break;
    case'gopl':show('pl');break;
    case'playpl':{const l=CTX['pl'+openId];if(l.length)play(l[0],l)}break;
    case'randpl':{const l=CTX['pl'+openId];if(l.length){shuf=true;$('#shuf').classList.add('on');play(l[Math.floor(Math.random()*l.length)],l)}}break;
    case'newpl':plEditor(null,el.dataset.t);break;
    case'editpl':plEditor(plById(openId));break;
    case'pick':$('#edf').click();break;
    case'hue':ed.p.hue=+el.dataset.h;$$('.sw i').forEach(i=>i.classList.toggle('on',i===el));if(!ed.p.cover)$('#edim').setAttribute('style',grad('x',ed.p.hue));break;
    case'savepl':{ed.p.name=$('#edn').value.trim()||'Ma playlist';ed.p.desc=$('#edd').value.trim();
      if(ed.isNew)mine.push(ed.p);else mine=mine.map(p=>p.id===ed.p.id?ed.p:p);saveMine();closeM();toast('Playlist enregistrée');refresh()}break;
    case'delpl':if(confirm('Supprimer cette playlist ?')){mine=mine.filter(p=>p.id!==ed.p.id);saveMine();closeM();show('pl')}break;
    case'addto':{const p=mine.find(x=>x.id===el.dataset.pl);if(!p.ids.includes(el.dataset.t))p.ids.push(el.dataset.t);saveMine();closeM();toast('Ajouté à « '+p.name+' »');refresh()}break;
    case'mv':{const p=mine.find(x=>x.id===openId),i=p.ids.indexOf(rid),j=i+ +el.dataset.d;if(j>=0&&j<p.ids.length){[p.ids[i],p.ids[j]]=[p.ids[j],p.ids[i]];saveMine();rPd()}}break;
    case'rm':{const p=mine.find(x=>x.id===openId);p.ids=p.ids.filter(x=>x!==rid);saveMine();rPd()}break;
  }}
function refresh(){if($('#v-pl').classList.contains('on'))rPl();if($('#v-pd').classList.contains('on'))rPd()}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){e.stopPropagation();act(a.dataset.act,a);return}
  if(e.target.closest('#mini')){$('#full').classList.add('on');return}
  const r=e.target.closest('.row[data-ctx]');if(r)play(r.dataset.id,CTX[r.dataset.ctx])});
$('#close').onclick=()=>$('#full').classList.remove('on');

const au=new Audio();au.preload='metadata';
let cur=null,queue=[],shuf=false,lines=[],li=-1,drag=false;
function parseLRC(s){const o=[];(s||'').split('\n').forEach(l=>{const tags=[...l.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];if(!tags.length)return;const x=l.replace(/\[[^\]]*\]/g,'').trim();tags.forEach(m=>o.push({t:+m[1]*60+ +m[2].replace(':','.'),x}))});return o.sort((a,b)=>a.t-b.t)}
function setLyrics(t){lines=parseLRC(t.lrc);li=-1;const ly=$('#ly');
  ly.innerHTML=lines.length?lines.map(l=>`<p>${esc(l.x||'…')}</p>`).join(''):'<p class="nl">Pas de paroles pour ce titre.</p>';ly.scrollTop=0;
  $$('#ly p').forEach((p,i)=>p.onclick=()=>{if(lines[i])au.currentTime=lines[i].t})}
function accent(t){const h=hue(t.title);const set=c=>document.documentElement.style.setProperty('--acc',c);set(`hsl(${h} 70% 38%)`);
  if(t.cover){const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=1;const x=c.getContext('2d');x.drawImage(im,0,0,1,1);const d=x.getImageData(0,0,1,1).data;set(`rgb(${d[0]*.8|0},${d[1]*.8|0},${d[2]*.8|0})`)}catch(e){}};im.src=t.cover}}
function play(id,list){
  const t=byId(id);if(!t)return;if(list&&list.length)queue=list;else if(!queue.includes(id))queue=S.tracks.map(x=>x.id);
  cur=id;au.src=t.src;au.play().catch(()=>{});
  setLyrics(t);
  if(!t.lrc&&t.lrcUrl)fetch(t.lrcUrl).then(r=>r.ok?r.text():'').then(x=>{t.lrc=x;if(cur===id)setLyrics(t)}).catch(()=>{});
  $('#ft').textContent=t.title;$('#fa').textContent=t.artist;
  [$('#fcv'),$('#mcv')].forEach(e=>e.setAttribute('style',cv(t)));
  $('#mt').textContent=t.title;$('#ma').textContent=t.artist;$('#mini').style.display='flex';
  accent(t);mark();
  if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:S.set.name,artwork:t.cover?[{src:t.cover}]:[]});
    navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1))}}
function step(d){if(!queue.length)return;let n;
  if(shuf&&queue.length>1){do{n=queue[Math.floor(Math.random()*queue.length)]}while(n===cur)}
  else n=queue[(queue.indexOf(cur)+d+queue.length)%queue.length];play(n)}
function toggle(){if(!cur){startRandom();return}au.paused?au.play():au.pause()}
function startRandom(){if(!S.tracks.length)return;shuf=true;$('#shuf').classList.add('on');const a=S.tracks.map(t=>t.id);play(a[Math.floor(Math.random()*a.length)],a)}
au.onplay=au.onpause=()=>{const p=au.paused;document.body.classList.toggle('pause',p);$$('[data-act=pp] use').forEach(u=>u.setAttribute('href',p?'#i-play':'#i-pause'))};
au.onended=()=>step(1);
au.onloadedmetadata=()=>{$('#du').textContent=fmt(au.duration)};
const sk=$('#seek');sk.oninput=()=>{drag=true;if(au.duration)au.currentTime=sk.value/100*au.duration};sk.onchange=()=>{drag=false};
au.ontimeupdate=()=>{const t=au.currentTime;$('#cu').textContent=fmt(t);if(!drag&&au.duration)sk.value=t/au.duration*100;
  if(lines.length){let n=-1;for(let i=0;i<lines.length;i++){if(lines[i].t<=t+.15)n=i;else break}
    if(n!==li){li=n;const ps=$$('#ly p');ps.forEach((p,i)=>p.classList.toggle('on',i===n));
      if(n>=0){const p=ps[n],c=$('#ly');c.scrollTo({top:p.offsetTop-c.clientHeight/2+p.clientHeight/2,behavior:'smooth'})}}}};

(async()=>{
  await load();const s=S.set;document.title=s.name;
  $('#slogo').innerHTML=s.logo?`<img src="${esc(s.logo)}" alt="${esc(s.name)}">`:`<div class="brand">${esc(s.name)}</div>`;
  $('#hlogo').innerHTML=s.logo?`<img src="${esc(s.logo)}" alt="">`:`<div class="brand">${esc(s.name)}</div>`;
  $('#fbr').textContent=s.name;$('#stag').textContent=s.tagline||'';
  $('#cr1').textContent=$('#cr2').textContent=s.footer||'';
  if(S.preview)$('#prev').style.display='';
  if(S.tracks.length)feat=S.tracks[Math.floor(Math.random()*S.tracks.length)].id;
  rHome();$('#enter').disabled=false;
  const out=()=>{$('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),800)};
  $('#enter').onclick=()=>{out();startRandom()};
  $('#silent').onclick=out;
})();
</script>
</body>
</html>
