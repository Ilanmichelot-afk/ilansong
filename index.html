<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ILANOVA</title>
<style>
:root{--bg:#fff;--fg:#000;--mut:#8a8a8e;--card:#f2f2f7;--line:#0000001a;--bar:#fffffff2;--sheet:#fff;--red:#1ed760;--on:#000;--pc:#7a3cff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--fg:#fff;--mut:#b3b3b3;--card:#282828;--line:#ffffff1a;--bar:#000000f0;--sheet:#282828}}
:root[data-theme=dark]{--bg:#121212;--fg:#fff;--mut:#b3b3b3;--card:#282828;--line:#ffffff1a;--bar:#000000f0;--sheet:#282828}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .15s,background .2s}
button:active{transform:scale(.92)}
input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--red)}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
@keyframes fu{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-50px) scale(1.2)}}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
@keyframes sh{to{background-position:200% 0}}
.fu,.row,.card{animation:fu .55s both;animation-delay:calc(var(--i,0)*50ms)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:fl 9s ease-in-out infinite}
.o1{width:340px;height:340px;background:#ff2d95;top:-60px;left:-80px}
.o2{width:380px;height:380px;background:#7a3cff;bottom:-100px;right:-100px;animation-delay:-3s}
.o3{width:240px;height:240px;background:#00c2ff;top:40%;left:55%;animation-delay:-6s}
.sc{position:relative;padding:24px}
.sc img{max-width:220px;max-height:140px;animation:pu 3s infinite}
.brand{font-size:44px;font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#ff2d95,#7a3cff,#00c2ff,#ff2d95);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
.sc p{color:#9a9ab0;margin:10px 0 28px}
.cr{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;color:#ffffff80;font-size:12px;padding:0 20px}
.btn{background:#fff;color:#111;font-weight:700;padding:12px 22px;border-radius:30px;display:inline-flex;gap:8px;align-items:center}
.btn.big{padding:16px 46px;font-size:18px;background:linear-gradient(135deg,#ff2d95,#7a3cff);color:#fff;box-shadow:0 0 40px #ff2d9570;animation:pu 2s infinite}
.btn.red{background:var(--red);color:var(--on,#000)}.btn:disabled{opacity:.4}
.lnk{display:block;margin:16px auto 0;color:#9a9ab0;font-size:13px;text-decoration:underline}
/* app */
#app{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 18px 200px}
header{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px;min-height:44px}
header h1{font-size:26px;font-weight:800;letter-spacing:-.3px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header img{height:36px;max-width:90px;object-fit:contain;border-radius:8px;margin-left:10px}
.chip{font-size:11px;background:var(--card);padding:4px 10px;border-radius:20px;color:var(--mut);margin-right:8px}
.view{display:none}.view.on{display:block}
h2{font-size:22px;font-weight:700;margin:28px 0 12px;display:flex;justify-content:space-between;align-items:center}
.lab{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin:14px 0 6px}
.hero{position:relative;border-radius:16px;aspect-ratio:1.15/1;max-height:420px;width:100%;background-size:cover;background-position:center;overflow:hidden;display:flex;align-items:flex-end;cursor:pointer;color:#fff}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000c,#0000 55%)}
.hs{position:relative;z-index:1;padding:16px;display:flex;align-items:flex-end;justify-content:space-between;width:100%}
.hs h3{font-size:22px}.hs p{opacity:.8;font-size:14px}
.pbtn{width:46px;height:46px;border-radius:50%;background:#ffffff38;backdrop-filter:blur(14px);display:grid;place-items:center;font-size:20px}
.scr{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
.card{flex:none;width:150px;text-align:left;cursor:pointer;transition:transform .25s}
.card:hover{transform:translateY(-5px)}
.card .im{aspect-ratio:1;border-radius:6px;background-size:cover;background-position:center;margin-bottom:8px;box-shadow:0 6px 20px #0003}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair{display:flex;gap:12px;margin:16px 0}
.pair button{flex:1;background:var(--card);color:var(--red);font-weight:600;padding:14px;border-radius:12px;display:flex;gap:8px;justify-content:center;align-items:center}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:8px 4px;border-radius:10px;cursor:pointer}
.row::after{display:none}
.row:hover{background:var(--card)}
.row.on .t{color:var(--red)}
.cv{width:50px;height:50px;border-radius:4px;flex:none;background-size:cover;background-position:center}
.row .i{flex:1;min-width:0}
.ib{width:38px;height:38px;border-radius:50%;color:var(--mut);display:grid;place-items:center;font-size:20px;flex:none}
.ib:hover{background:var(--card)}
.eq{display:none;gap:2px;align-items:flex-end;height:16px;width:18px}.row.on .eq{display:flex}
.eq i{flex:1;background:var(--red);border-radius:2px;animation:eq .8s infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
body.pause .eq i{animation-play-state:paused}
.empty{color:var(--mut);padding:30px 6px;text-align:center;line-height:1.6}
.cr2{text-align:center;color:var(--mut);font-size:12px;margin-top:40px}
.back{color:var(--red);font-size:17px;display:inline-flex;align-items:center;gap:2px;padding:6px 0}
.pdt{display:flex;justify-content:space-between;align-items:center}
.pdc{text-align:left;margin:8px 0}.pdc .im{width:min(62%,260px);aspect-ratio:1;border-radius:14px;background-size:cover;background-position:center;margin:0 auto 14px;box-shadow:0 12px 36px #0004}
.pdc h1{font-size:24px}
.sbx{position:relative}.sbx .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}.sbx input{padding-left:38px;border:0}
.hbt{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:21px;color:var(--fg);background:var(--card);margin-left:8px;flex:none}
.hbt .dot{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--card);display:none}
.hbt.new .dot{display:block;animation:pu 1.4s infinite}
.news{padding:12px 0;border-bottom:1px solid var(--line)}.news b{display:block;font-size:17px}.news .s{margin:2px 0 6px}.news p{white-space:pre-wrap;line-height:1.45}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 4px #0002}
.srow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.tg{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:.25s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 1px 4px #0004}
.tg.on{background:var(--red)}.tg.on::after{left:23px}
.noblur #ly p{filter:none!important}
.noanim *,.noanim *::before,.noanim *::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.qt{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:6px;overflow:hidden;height:56px;cursor:pointer;animation:fu .5s both;animation-delay:calc(var(--i,0)*45ms);transition:background .2s,transform .15s}
.qt:hover{background:var(--line)}.qt:active{transform:scale(.97)}
.qt .cv{width:56px;height:56px;border-radius:0}
.qt .t{flex:1;min-width:0;font-size:13px;font-weight:700;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2}
.qt .eq{display:none;margin-right:8px}.qt.on .eq{display:flex}.qt.on .t,.card.on .t{color:var(--red)}
.pb{display:flex;align-items:center;justify-content:space-between;margin:12px 0 6px}
.shb{font-size:26px;color:var(--mut);width:46px;height:46px;display:grid;place-items:center;border-radius:50%}.shb:hover{color:var(--fg)}
.bigplay{width:58px;height:58px;border-radius:50%;background:var(--red);color:var(--on,#000);display:grid;place-items:center;font-size:26px;box-shadow:0 6px 20px #0005}
.btg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bt{height:96px;border-radius:8px;padding:12px;font-weight:800;font-size:16px;color:#fff;overflow:hidden;cursor:pointer;animation:fu .5s both;animation-delay:calc(var(--i,0)*40ms)}
#mini .s{color:#ffffffb3}
/* mini + tabs */
#mini{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));max-width:744px;margin:auto;background:var(--bar);background:color-mix(in srgb,var(--pc) 88%,#000);color:#fff;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;box-shadow:0 6px 24px #0003;display:none;align-items:center;gap:8px;padding:7px 8px;cursor:pointer;overflow:hidden;animation:fu .45s;z-index:6}
#mini .i{flex:1;min-width:0}
#mini .ib{color:#fff;font-size:22px;width:40px}
#mini #mpb{position:absolute;left:0;bottom:0;height:2px;background:#fff;width:0}
#tabs{position:fixed;bottom:0;left:0;right:0;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);z-index:5}
#tabs button{flex:1;max-width:220px;padding:9px 0 8px;color:var(--mut);font-size:10px;font-weight:500}
#tabs button .ic{display:block;margin:0 auto 3px;font-size:24px}
#tabs button.on{color:var(--fg)}
/* lecteur plein écran */
#full{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;color:#fff;padding:calc(8px + env(safe-area-inset-top)) 24px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,var(--pc),#000 92%);transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#full.on{transform:none}
#full>*{position:relative;z-index:1;flex:none}
#full>#bgc{position:absolute;inset:-22%;z-index:0;background-size:cover;background-position:center;filter:blur(46px) saturate(1.8) brightness(.62);animation:bgm 30s ease-in-out infinite alternate;will-change:transform}
@keyframes bgm{0%{transform:rotate(0) scale(1.05)}100%{transform:rotate(16deg) scale(1.3) translate(3%,2%)}}
body.pause #bgc{animation-play-state:paused}
#full>#bgo{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,#0000 35%,#000b 100%)}
#full .orb{position:absolute;z-index:0;opacity:.4;width:320px;height:320px;background:var(--pc)}
#full .o2{filter:blur(80px) hue-rotate(60deg)}
.fbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px}.grab{display:block;width:42px;height:5px;border-radius:3px;background:#ffffff66}
.xbtn{width:38px;height:38px;border-radius:50%;background:#ffffff2e;color:#fff;display:grid;place-items:center;font-size:20px;flex:none}.xbtn:hover{background:#ffffff4d}
#mh{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
#mh .i{flex:1;min-width:0}#mh .s,#full .s{color:#ffffffb0}
#art{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#fcv{width:min(100%,46vh);aspect-ratio:1;border-radius:12px;box-shadow:0 20px 60px #000a;background-size:cover;background-position:center;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
body.pause #fcv{transform:scale(.84)}
#tt{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
#tt .i{flex:1;min-width:0}#ft{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#fa{font-size:18px;color:#ffffffa8}
#full .ib{color:#fff;background:#ffffff26;width:34px;height:34px;font-size:16px}
#ly,#ql{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none;mask-image:linear-gradient(transparent,#000 12%,#000 85%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 85%,transparent)}
#ly::-webkit-scrollbar,#ql::-webkit-scrollbar{display:none}
#ly::before,#ly::after{content:"";display:block;height:25vh}
#ly p{--g:#ffffff70;font-size:var(--lys,28px);font-weight:800;line-height:1.25;color:#ffffff59;padding:9px 4px;filter:blur(var(--b,1.5px));transition:filter .6s ease,opacity .6s ease,transform .6s ease;transform-origin:left center;cursor:pointer}
#ly p.past{opacity:.72}
#ly p.on{opacity:1;transform:scale(1.02)}
#ly .w{background:linear-gradient(90deg,#fff calc(var(--p,0%)*1.15 - 15%),var(--g) calc(var(--p,0%)*1.15));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.dots{display:flex;gap:9px;padding:14px 4px;opacity:0;transition:opacity .5s}.dots.on{opacity:1}
.dots i{width:15px;height:15px;border-radius:50%;background:#fff;opacity:calc(.3 + .7*var(--d,0));transform:scale(calc(.75 + .35*var(--d,0)))}
#ly .nl{font-size:18px;font-weight:600;filter:none}
#ql .row:hover{background:#ffffff14}#ql .row::after{background:#ffffff1a}#ql .row.on .t{color:#fff}#ql .eq i{background:#fff}#ql .s{color:#ffffffa0}
#full:not([data-m=art]) #art,#full:not([data-m=art]) #tt,#full:not([data-m=art]) .vol{display:none}
#full:not([data-m=ly]) #ly{display:none}#full:not([data-m=q]) #ql{display:none}#full[data-m=art] #mh{display:none}
#sb{padding-top:8px}
input.sk{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;border:0;padding:0;margin:0}
.sk::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#fff var(--p,0%),#ffffff40 var(--p,0%))}
.sk::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-4px;box-shadow:0 1px 6px #0006}
.sk::-moz-range-track{height:6px;border-radius:3px;background:#ffffff40}.sk::-moz-range-progress{height:6px;border-radius:3px;background:#fff}
.sk::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
.tm{display:flex;justify-content:space-between;font-size:12px;color:#ffffffb0;margin-top:2px}
.ctl{display:flex;justify-content:center;align-items:center;gap:28px;padding:6px 0}
.ctl button{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff}
.ctl .pp{font-size:28px;width:72px;height:72px;background:#fff;color:#000}
.vol{display:flex;align-items:center;gap:10px;padding:4px 4px 10px;color:#ffffffb0}
.bot{display:flex;justify-content:space-around;padding-top:4px}
.bot button{width:52px;height:46px;border-radius:12px;font-size:24px;color:#ffffffb8;display:grid;place-items:center}
.bot button.on{background:#ffffff30;color:#fff}
/* modal */
#modal{position:fixed;inset:0;background:#0008;z-index:40;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--sheet);color:var(--fg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:fu .35s}
.sheet h3{margin-bottom:14px}.sheet label{display:block;color:var(--mut);font-size:12px;margin:12px 0 5px}
.sw{display:flex;gap:10px}.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw i.on{border-color:var(--fg)}
.cp{display:flex;gap:12px;align-items:center}.cp .im{width:70px;height:70px;border-radius:12px;background-size:cover;background-position:center;background-color:var(--card)}
.acts{display:flex;gap:10px;margin-top:20px}.acts .btn{flex:1;justify-content:center}.danger{background:#ff3b5c!important;color:#fff!important}
.sheet .btn.alt{background:var(--card);color:var(--fg)}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);background:#222;color:#fff;padding:10px 18px;border-radius:30px;z-index:60;transition:transform .4s;font-weight:600;font-size:14px}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body class="pause">
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21" fill="currentColor"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="currentColor"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><polygon points="2 5 12 12 2 19" fill="currentColor"/><polygon points="12 5 22 12 12 19" fill="currentColor"/></symbol>

<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4h6v2"/></symbol>
<symbol id="i-playc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16" fill="currentColor"/></symbol>
<symbol id="i-lib" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
<symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></symbol>
<symbol id="i-dn" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>

 <header><h1 id="ttl">À l’écoute</h1><div style="display:flex;align-items:center"><span class="chip" id="prev" style="display:none">Aperçu local</span><button class="hbt" id="nbtn" data-act="news" aria-label="Actualités"><svg class="ic"><use href="#i-bell"/></svg><i class="dot"></i></button><button class="hbt" data-act="cfg" aria-label="Paramètres"><svg class="ic"><use href="#i-set"/></svg></button><div id="hlogo"></div></div></header>

 <section class="view" id="v-search"><div class="sbx"><svg class="ic"><use href="#i-search"/></svg><input id="q" placeholder="Titres, artistes…" autocomplete="off"></div><div id="qr" style="margin-top:12px"></div></section>

 <div id="mh"><div class="cv" id="mhc"></div><div class="i"><div class="t" id="mht"></div><div class="s" id="mha"></div></div><button class="ib" data-act="addcur"><svg class="ic"><use href="#i-more"/></svg></button></div>
 <div id="art"><div id="fcv"></div></div>
 <div id="tt"><div class="i"><div id="ft"></div><div id="fa"></div></div><button class="ib" data-act="addcur"><svg class="ic"><use href="#i-more"/></svg></button></div>
 <div id="ly"></div><div id="ql"></div>
 <div id="sb"><input class="sk" type="range" id="seek" min="0" max="100" value="0" step="0.1"><div class="tm"><span id="cu">0:00</span><span id="du">-0:00</span></div></div>
 <div class="ctl"><button data-act="prev"><svg class="ic"><use href="#i-prev"/></svg></button><button class="pp" data-act="pp"><svg class="ic"><use href="#i-play"/></svg></button><button data-act="next"><svg class="ic"><use href="#i-next"/></svg></button></div>
 <div class="vol"><svg class="ic"><use href="#i-v0"/></svg><input class="sk" type="range" id="vol" min="0" max="100" value="100"><svg class="ic"><use href="#i-v1"/></svg></div>
 <div class="bot"><button data-act="mode" data-m="ly"><svg class="ic"><use href="#i-msg"/></svg></button><button id="shuf" data-act="shuf"><svg class="ic"><use href="#i-shuffle"/></svg></button><button data-act="mode" data-m="q"><svg class="ic"><use href="#i-list"/></svg></button></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const hue=t=>{let h=0;for(const c of String(t))h=(h*31+c.charCodeAt(0))%360;return h};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove('on'),2200)}

let S={tracks:[],pls:[],news:[],set:{name:'ILANOVA',tagline:'Ta musique, sans limites.',footer:'',logo:''},preview:false};
let mine=[];try{mine=JSON.parse(localStorage.getItem('ilanova_pl')||'[]')}catch(e){}
const saveMine=()=>{try{localStorage.setItem('ilanova_pl',JSON.stringify(mine))}catch(e){toast('Stockage plein')}};
const CFG0={theme:'dark',acc:'#1ed760',lys:28,blur:true,anim:true,rand:true};
let cfg={...CFG0};try{cfg={...CFG0,...JSON.parse(localStorage.getItem('ilanova_cfg2')||'{}')}}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('ilanova_cfg2',JSON.stringify(cfg))}catch(e){}};
function applyCfg(){const r=document.documentElement;if(cfg.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',cfg.theme);
  r.style.setProperty('--red',cfg.acc);{const h=cfg.acc.replace('#','');const L=(parseInt(h.slice(0,2),16)*.299+parseInt(h.slice(2,4),16)*.587+parseInt(h.slice(4,6),16)*.114)/255;r.style.setProperty('--on',L>.5?'#000':'#fff')}r.style.setProperty('--lys',cfg.lys+'px');r.classList.toggle('noblur',!cfg.blur);r.classList.toggle('noanim',!cfg.anim);
  const dk=cfg.theme==='dark'||(cfg.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dk?'#000000':'#ffffff'}
applyCfg();
function idbGet(k){return new Promise(res=>{try{const r=indexedDB.open('ilanova',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onerror=()=>res();r.onsuccess=()=>{const q=r.result.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res()}}catch(e){res()}})}
async function load(){
  const loc=await idbGet('lib');
  if(loc&&loc.tracks&&loc.tracks.length){
    S.preview=true;S.set={...S.set,...loc.settings};
    const u=async k=>{const b=await idbGet(k);return b?URL.createObjectURL(b):''};
    S.tracks=(await Promise.all(loc.tracks.map(async t=>({id:t.id,title:t.title,artist:t.artist,src:await u('a:'+t.id),cover:t.coverExt?await u('c:'+t.id):'',lrc:t.lrcText||''})))).filter(t=>t.src);
    S.pls=await Promise.all((loc.playlists||[]).map(async p=>({...p,cover:p.coverExt?await u('p:'+p.id):''})));
    S.set.logo=loc.settings&&loc.settings.logoExt?await u('logo'):'';S.news=loc.news||[];
  }else{
    try{const l=await(await fetch('library.json',{cache:'no-store'})).json();S.set={...S.set,...l.settings};
      S.tracks=(l.tracks||[]).map(t=>({id:t.id,title:t.title,artist:t.artist,src:t.audio,cover:t.cover||'',lrc:'',lrcUrl:t.lrc||''}));S.pls=l.playlists||[];S.news=l.news||[]}catch(e){}
  }
}
const byId=id=>S.tracks.find(t=>t.id===id);
const allPls=()=>[...S.pls.map(p=>({...p,official:true})),...mine];
const plById=id=>allPls().find(p=>p.id===id);
const bg=u=>u?`background-image:url('${u}')`:'';
const grad=(s,h)=>`background:linear-gradient(135deg,hsl(${h??hue(s)} 70% 52%),hsl(${((h??hue(s))+60)%360} 70% 30%))`;
const cv=t=>t.cover?bg(t.cover):grad(t.title);
const plCover=p=>p.cover||((byId((p.ids||[])[0])||{}).cover)||'';
const plStyle=p=>plCover(p)?bg(plCover(p)):grad(p.name,p.hue);
const CTX={};

function row(t,ctx,i,extra=''){return `<div class="row" data-id="${t.id}" data-ctx="${ctx}" style="--i:${i}"><div class="cv" style="${cv(t)}"></div><div class="i"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist)}</div></div><div class="eq"><i></i><i></i><i></i></div>${extra}<button class="ib" data-act="add" title="Ajouter à une playlist">${I('more')}</button></div>`}
function plCard(p,i){return `<div class="card" data-act="openpl" data-pl="${p.id}" style="--i:${i}"><div class="im" style="${plStyle(p)}"></div><div class="t">${esc(p.name)}</div><div class="s">${p.official?'Playlist officielle':(p.ids||[]).length+' titre(s)'}</div></div>`}
let feat=null;
let hist=[];try{hist=JSON.parse(localStorage.getItem('ilanova_hist')||'[]')}catch(e){}
let rnd=[];
const shuffleArr=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function quickIds(){const h=hist.filter(id=>byId(id));return [...h,...rnd.filter(id=>!h.includes(id))].slice(0,6)}
const qTile=(id,i)=>{const t=byId(id);return `<div class="qt" data-id="${id}" data-ctx="all" style="--i:${i}"><div class="cv" style="${cv(t)}"></div><div class="t">${esc(t.title)}</div><div class="eq"><i></i><i></i><i></i></div></div>`};
const tCard=(t,ctx,i)=>`<div class="card" data-id="${t.id}" data-ctx="${ctx}" style="--i:${i}"><div class="im" style="${cv(t)}"></div><div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist)}</div></div>`;
const greet=()=>{const h=new Date().getHours();return h<6?'Bonne nuit':h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir'};
const plRow=(p,i)=>`<div class="row" data-act="openpl" data-pl="${p.id}" style="--i:${i}"><div class="cv" style="${plStyle(p)};width:56px;height:56px"></div><div class="i"><div class="t">${esc(p.name)}</div><div class="s">Playlist · ${(p.ids||[]).length} titre(s)${p.official?' · officielle':''}</div></div></div>`;
function rHome(){
  let h='';
  if(!S.tracks.length)h='<div class="empty">Aucune musique pour l’instant.<br>Ajoute-les depuis la page <b>admin.html</b>.</div>';
  else{CTX.all=S.tracks.map(t=>t.id);CTX.rnd=rnd;
    h=`<div class="qg" id="qg">${quickIds().map(qTile).join('')}</div>`;
    h+=`<h2>Fait pour toi</h2><div class="scr">${rnd.map((id,i)=>tCard(byId(id),'rnd',i)).join('')}</div>`;
    const P=allPls();if(P.length)h+=`<h2>Playlists</h2><div class="scr">${P.map(plCard).join('')}</div>`;
    h+=`<h2>Tous les titres</h2><div class="pb"><button class="shb" data-act="rand" aria-label="Aléatoire">${I('shuffle')}</button><button class="bigplay" data-act="playall" aria-label="Lecture">${I('play')}</button></div>`+S.tracks.map((t,i)=>row(t,'all',i)).join('')}
  $('#v-home').innerHTML=h;mark()}
function rPl(){
  const P=allPls();
  $('#v-pl').innerHTML=`<div class="pdt"><span class="s" style="font-weight:600">Playlists</span><button class="btn red" data-act="newpl">${I('plus')} Créer</button></div><div style="margin-top:8px"><div class="row" data-act="rand"><div class="cv" style="background:linear-gradient(135deg,#450af5,#8e8ee5);width:56px;height:56px;display:grid;place-items:center;color:#fff;font-size:24px">${I('shuffle')}</div><div class="i"><div class="t">Mix aléatoire</div><div class="s">Tous tes titres, dans le désordre</div></div></div>`+(P.length?P.map(plRow).join(''):'<div class="empty">Crée ta première playlist : nom, photo, description, couleur.</div>')+'</div>'}
let openId=null;
function rPd(){
  const p=plById(openId);if(!p){show('pl');return}
  const ids=(p.ids||[]).filter(byId);CTX['pl'+p.id]=ids;
  let h=`<div class="pdt"><button class="back" data-act="gopl">${I('back')} Bibliothèque</button>${p.official?'':`<button class="back" data-act="editpl">Modifier</button>`}</div>
  <div class="pdc"><div class="im" style="${plStyle(p)}"></div><h1>${esc(p.name)}</h1><div class="s">${esc(p.desc||'')}</div><div class="s">${ids.length} titre(s)</div></div>
  <div class="pb"><button class="shb" data-act="randpl" aria-label="Aléatoire">${I('shuffle')}</button><button class="bigplay" data-act="playpl" aria-label="Lecture">${I('play')}</button></div>`;
  h+=ids.length?ids.map((id,i)=>row(byId(id),'pl'+p.id,i,p.official?'':`<button class="ib" data-act="mv" data-d="-1">${I('up')}</button><button class="ib" data-act="mv" data-d="1">${I('dn')}</button><button class="ib" data-act="rm">${I('trash')}</button>`)).join(''):'<div class="empty">Playlist vide. Ajoute des titres avec le bouton ···</div>';
  $('#v-pd').innerHTML=h;mark()}
const TT={home:'À l’écoute',search:'Recherche',pl:'Bibliothèque',pd:'Playlist'};
function show(v){$$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===(v==='pd'?'pl':v)));
  $('#ttl').textContent=v==='home'?greet():TT[v];$('header').style.display=v==='pd'?'none':'';
  if(v==='pl')rPl();if(v==='pd')rPd();if(v==='home')rHome();window.scrollTo(0,0)}
function mark(){$$('.row,.qt,.card').forEach(r=>r.classList.toggle('on',r.dataset.id===cur))}
$$('#tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('#q').oninput=e=>{const q=e.target.value.toLowerCase().trim();const r=q?S.tracks.filter(t=>(t.title+' '+t.artist).toLowerCase().includes(q)):[];CTX.q=r.map(t=>t.id);
  if(!q){const A=[...new Set(S.tracks.map(t=>t.artist).filter(Boolean))];
    $('#qr').innerHTML=A.length?`<h2 style="margin-top:6px">Parcourir tout</h2><div class="btg">${A.map((a,i)=>`<div class="bt" data-act="artist" data-a="${esc(a)}" style="--i:${i};background:linear-gradient(135deg,hsl(${hue(a)} 65% 42%),hsl(${(hue(a)+40)%360} 65% 28%))">${esc(a)}</div>`).join('')}</div>`:'<div class="empty">Cherche un titre ou un artiste.</div>';return}
  $('#qr').innerHTML=r.length?r.map((t,i)=>row(t,'q',i)).join(''):'<div class="empty">Aucun résultat.</div>';mark()};

const modal=h=>{$('#sheet').innerHTML=h;$('#modal').classList.add('on')};
const closeM=()=>$('#modal').classList.remove('on');
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
function addMenu(id){
  modal(`<h3>Ajouter à une playlist</h3>`+mine.map(p=>`<div class="row" data-act="addto" data-pl="${p.id}" data-t="${id}"><div class="cv" style="${plStyle(p)}"></div><div class="i"><div class="t">${esc(p.name)}</div></div></div>`).join('')+`<div class="row" data-act="newpl" data-t="${id}"><div class="cv" style="background:var(--card);display:grid;place-items:center">${I('plus')}</div><div class="i"><div class="t">Nouvelle playlist</div></div></div>`)}
const HUES=[350,270,200,150,40,0];
let ed=null;
function plEditor(p,addId){
  ed={p:p?{...p}:{id:'p'+Date.now(),name:'',desc:'',hue:350,cover:'',ids:addId?[addId]:[]},isNew:!p};
  modal(`<h3>${p?'Modifier la playlist':'Nouvelle playlist'}</h3><div class="cp"><div class="im" id="edim" style="${ed.p.cover?bg(ed.p.cover):grad('x',ed.p.hue)}"></div><div><input type="file" id="edf" accept="image/*" hidden><button class="btn alt" data-act="pick">Choisir une photo</button></div></div>
  <label>Nom</label><input id="edn" maxlength="40" value="${esc(ed.p.name)}" placeholder="Ma playlist">
  <label>Description</label><textarea id="edd" rows="2" maxlength="140">${esc(ed.p.desc)}</textarea>
  <label>Couleur (sans photo)</label><div class="sw">${HUES.map(h=>`<i data-act="hue" data-h="${h}" class="${h===ed.p.hue?'on':''}" style="background:hsl(${h} 70% 50%)"></i>`).join('')}</div>
  <div class="acts">${p?`<button class="btn danger" data-act="delpl">${I('trash')}</button>`:''}<button class="btn red" data-act="savepl">Enregistrer</button></div>`);
  $('#edf').onchange=async e=>{const f=e.target.files[0];if(!f)return;ed.p.cover=await shrink(f);$('#edim').setAttribute('style',bg(ed.p.cover))}}
function shrink(f){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,360/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};im.src=u})}

const fmtD=d=>{try{return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}catch(e){return ''}};
const newsSorted=()=>[...S.news].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
function newsDot(){const n=newsSorted();let seen='';try{seen=localStorage.getItem('ilanova_seen')||''}catch(e){}$('#nbtn').classList.toggle('new',!!n.length&&n[0].id!==seen)}
function openNews(){const n=newsSorted();
  modal('<h3>Actualités</h3>'+(n.length?n.map(x=>`<div class="news"><b>${esc(x.title||'')}</b><div class="s">${esc(fmtD(x.date))}</div><p>${esc(x.text||'')}</p></div>`).join(''):'<div class="empty">Rien de nouveau pour l’instant.</div>')+'<div class="acts"><button class="btn red" data-act="close">Fermer</button></div>');
  try{localStorage.setItem('ilanova_seen',n.length?n[0].id:'')}catch(e){}$('#nbtn').classList.remove('new')}
const ACCS=['#1ed760','#ff2d95','#7a3cff','#0a84ff','#ff9f0a','#fa2d48'];
function openCfg(){
  const seg=(k,o)=>`<div class="seg">${o.map(x=>`<button data-act="cs" data-k="${k}" data-v="${x[0]}" class="${String(cfg[k])===String(x[0])?'on':''}">${x[1]}</button>`).join('')}</div>`;
  const tg=(k,l,d)=>`<div class="srow"><div><div class="t">${l}</div><div class="s" style="white-space:normal">${d}</div></div><button class="tg ${cfg[k]?'on':''}" data-act="ct" data-k="${k}" aria-label="${l}"></button></div>`;
  modal(`<h3>Paramètres</h3><label>Thème</label>${seg('theme',[['auto','Auto'],['light','Clair'],['dark','Sombre']])}
  <label>Couleur</label><div class="sw">${ACCS.map(c=>`<i data-act="cs" data-k="acc" data-v="${c}" class="${cfg.acc===c?'on':''}" style="background:${c}"></i>`).join('')}</div>
  <label>Taille des paroles</label>${seg('lys',[[22,'Petite'],[28,'Normale'],[34,'Grande']])}
  <div style="margin-top:8px">${tg('blur','Flou des paroles','Floute les lignes qui ne sont pas en cours.')}${tg('anim','Animations','Coupe-les si ton téléphone rame.')}</div>
  <div class="acts"><button class="btn alt" data-act="creset">Réinitialiser</button><button class="btn red" data-act="close">OK</button></div>`)}
function setMode(m){const f=$('#full');f.dataset.m=m;$$('.bot button[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));if(m==='q')rQ()}
function rQ(){CTX.qq=queue;$('#ql').innerHTML=queue.map((id,i)=>byId(id)?row(byId(id),'qq',i):'').join('');mark()}
function act(a,el){
  const rw=el.closest('.row'),rid=rw&&rw.dataset.id;
  switch(a){
    case'pp':toggle();break;case'next':step(1);break;case'prev':if(au.currentTime>3)au.currentTime=0;else step(-1);break;
    case'shuf':shuf=!shuf;$('#shuf').classList.toggle('on',shuf);break;
    case'mode':setMode($('#full').dataset.m===el.dataset.m?'art':el.dataset.m);break;
    case'addcur':if(cur)addMenu(cur);break;
    case'add':addMenu(rid);break;
    case'rand':startRandom();break;
    case'playfeat':play(feat,CTX.all);break;
    case'playall':if(CTX.all&&CTX.all.length){shuf=false;$('#shuf').classList.remove('on');play(CTX.all[0],CTX.all)}break;
    case'openpl':openId=el.dataset.pl;show('pd');break;
    case'gopl':show('pl');break;
    case'playpl':{const l=CTX['pl'+openId];if(l.length){shuf=false;$('#shuf').classList.remove('on');play(l[0],l)}}break;
    case'randpl':{const l=CTX['pl'+openId];if(l.length){shuf=true;$('#shuf').classList.add('on');play(l[Math.floor(Math.random()*l.length)],l)}}break;
    case'newpl':plEditor(null,el.dataset.t);break;
    case'editpl':plEditor(plById(openId));break;
    case'pick':$('#edf').click();break;
    case'hue':ed.p.hue=+el.dataset.h;$$('.sw i').forEach(i=>i.classList.toggle('on',i===el));if(!ed.p.cover)$('#edim').setAttribute('style',grad('x',ed.p.hue));break;
    case'savepl':{ed.p.name=$('#edn').value.trim()||'Ma playlist';ed.p.desc=$('#edd').value.trim();
      if(ed.isNew)mine.push(ed.p);else mine=mine.map(p=>p.id===ed.p.id?ed.p:p);saveMine();closeM();toast('Playlist enregistrée');refresh()}break;
    case'delpl':if(confirm('Supprimer cette playlist ?')){mine=mine.filter(p=>p.id!==ed.p.id);saveMine();closeM();show('pl')}break;
    case'addto':{const p=mine.find(x=>x.id===el.dataset.pl);if(!p.ids.includes(el.dataset.t))p.ids.push(el.dataset.t);saveMine();closeM();toast('Ajouté à « '+p.name+' »');refresh()}break;
    case'mv':{const p=mine.find(x=>x.id===openId),i=p.ids.indexOf(rid),j=i+ +el.dataset.d;if(j>=0&&j<p.ids.length){[p.ids[i],p.ids[j]]=[p.ids[j],p.ids[i]];saveMine();rPd()}}break;
    case'rm':{const p=mine.find(x=>x.id===openId);p.ids=p.ids.filter(x=>x!==rid);saveMine();rPd()}break;
    case'artist':$('#q').value=el.dataset.a;$('#q').oninput({target:$('#q')});break;
    case'news':openNews();break;case'cfg':openCfg();break;case'close':closeM();break;
    case'cs':{const k=el.dataset.k;cfg[k]=k==='lys'?+el.dataset.v:el.dataset.v;saveCfg();applyCfg();openCfg()}break;
    case'ct':{const k=el.dataset.k;cfg[k]=!cfg[k];saveCfg();applyCfg();openCfg()}break;
    case'creset':cfg={...CFG0};saveCfg();applyCfg();openCfg();break;
  }}
function refresh(){if($('#v-pl').classList.contains('on'))rPl();if($('#v-pd').classList.contains('on'))rPd()}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){e.stopPropagation();act(a.dataset.act,a);return}
  if(e.target.closest('#mini')){openFull();return}
  const r=e.target.closest('.row[data-ctx],.qt[data-ctx],.card[data-ctx]');if(r)play(r.dataset.id,CTX[r.dataset.ctx])});
function openFull(){$('#full').classList.add('on');try{history.pushState({f:1},'')}catch(e){}}
function closeFull(){const f=$('#full');if(!f.classList.contains('on'))return;f.classList.remove('on');setMode('art');if(history.state&&history.state.f){try{history.back()}catch(e){}}}
$('#close').onclick=closeFull;
addEventListener('popstate',()=>{const f=$('#full');if(f.classList.contains('on')){f.classList.remove('on');setMode('art')}});
{let ty=null;const fb=$('.fbar');fb.addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});fb.addEventListener('touchend',e=>{if(ty!=null&&e.changedTouches[0].clientY-ty>50)closeFull();ty=null})}

const au=new Audio();au.preload='metadata';
let cur=null,queue=[],shuf=false,lines=[],li=-1,drag=false;
function parseLRC(s){const o=[];(s||'').split('\n').forEach(l=>{const tags=[...l.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];if(!tags.length)return;const raw=l.replace(/\[[^\]]*\]/g,'').trim();
  let ws=null;if(/<\d+:\d+/.test(raw)){ws=[];const re=/<(\d+):(\d+(?:[.:]\d+)?)>([^<]*)/g;let m;while((m=re.exec(raw))){const w=m[3].trim();if(w)ws.push({t:+m[1]*60+ +m[2].replace(':','.'),x:w})}}
  const x=raw.replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
  tags.forEach(m=>o.push({t:+m[1]*60+ +m[2].replace(':','.'),x,ws,exp:!!(ws&&ws.length)}))});
  o.sort((a,b)=>a.t-b.t);
  o.forEach((l,i)=>{l.e=Math.min(i+1<o.length?o[i+1].t:l.t+4,l.t+7);
    if(!l.ws||!l.ws.length){const w=l.x.split(' ').filter(Boolean),sy=x=>(x.match(/[aeiouyàâäéèêëïîôöùûüœ]+/gi)||[]).length+.4,tot=w.reduce((a,b)=>a+sy(b),0)||1,d=(l.e-l.t)*.92;let a=l.t;l.ws=w.map(x=>{const r={t:a,x};a+=d*sy(x)/tot;return r})}
    l.ws.forEach((w,j)=>{w.e=j+1<l.ws.length?l.ws[j+1].t:(l.exp?Math.min(l.e,w.t+Math.min(1.8,.4+.09*w.x.length)):l.e)})});
  return o}
let lyP=[],dotsEl=null,looping=false;
function setLyrics(t){lines=parseLRC(t.lrc);li=-1;const ly=$('#ly');
  ly.innerHTML=lines.length?'<div class="dots"><i></i><i></i><i></i></div>'+lines.map(l=>`<p>${l.x?l.ws.map(w=>`<span class="w">${esc(w.x)}</span>`).join(' '):'…'}</p>`).join(''):'<p class="nl">Pas de paroles pour ce titre.</p>';ly.scrollTop=0;
  lyP=[...ly.querySelectorAll('p')];dotsEl=ly.querySelector('.dots');
  lyP.forEach((p,i)=>p.onclick=()=>{if(lines[i])au.currentTime=lines[i].t})}
function lyTick(){
  if(!lines.length)return;const t=au.currentTime,first=lines[0].t;
  if(dotsEl){const show=first>2.5&&t<first-.2;dotsEl.classList.toggle('on',show);
    if(show)[...dotsEl.children].forEach((d,i)=>d.style.setProperty('--d',Math.max(0,Math.min(1,t/(first-.2)*3-i))))}
  let n=-1;for(let i=0;i<lines.length;i++){if(lines[i].t<=t+.1)n=i;else break}
  if(n!==li){li=n;const B=[0,.3,.8,1.5,2.4,3.4];
    lyP.forEach((p,i)=>{p.classList.toggle('on',i===n);p.classList.toggle('past',i<n);p.style.setProperty('--b',B[Math.min(Math.abs(i-n),5)]+'px');
      if(i!==n){const v=i<n?'100%':'0%';for(const sp of p.children)sp.style.setProperty('--p',v)}});
    if(n>=0&&lyP[n]){const c=$('#ly');c.scrollTo({top:lyP[n].offsetTop-c.clientHeight*.3,behavior:'smooth'})}else $('#ly').scrollTo({top:0,behavior:'smooth'})}
  if(n>=0&&lyP[n]){const ws=lines[n].ws,sp=lyP[n].children;
    for(let j=0;j<ws.length&&j<sp.length;j++){const w=ws[j],p=t<=w.t?0:t>=w.e?100:(t-w.t)/Math.max(.05,w.e-w.t)*100;sp[j].style.setProperty('--p',p+'%')}}}
function lyLoop(){if(looping)return;looping=true;(function f(){lyTick();if(!au.paused)requestAnimationFrame(f);else looping=false})()}
function accent(t){const h=hue(t.title);const set=c=>document.documentElement.style.setProperty('--pc',c);set(`hsl(${h} 60% 36%)`);
  if(t.cover){const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=1;const x=c.getContext('2d');x.drawImage(im,0,0,1,1);const d=x.getImageData(0,0,1,1).data;set(`rgb(${d[0]*.75|0},${d[1]*.75|0},${d[2]*.75|0})`)}catch(e){}};im.src=t.cover}}
function play(id,list){
  const t=byId(id);if(!t)return;if(list&&list.length)queue=list;else if(!queue.includes(id))queue=S.tracks.map(x=>x.id);
  cur=id;au.src=t.src;au.play().catch(()=>{});
  hist=[id,...hist.filter(x=>x!==id)].slice(0,20);try{localStorage.setItem('ilanova_hist',JSON.stringify(hist))}catch(e){}
  setLyrics(t);
  if(!t.lrc&&t.lrcUrl)fetch(t.lrcUrl).then(r=>r.ok?r.text():'').then(x=>{t.lrc=x;if(cur===id)setLyrics(t)}).catch(()=>{});
  $('#ft').textContent=$('#mht').textContent=$('#mt').textContent=t.title;
  $('#fa').textContent=$('#mha').textContent=$('#ma').textContent=t.artist;
  [$('#fcv'),$('#mcv'),$('#mhc'),$('#bgc')].forEach(e=>e.setAttribute('style',(e.id==='mcv'?'width:44px;height:44px;':'')+cv(t)));
  $('#mini').style.display='flex';accent(t);mark();if($('#full').dataset.m==='q')rQ();
  if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:S.set.name,artwork:t.cover?[{src:t.cover}]:[]});
    navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1));
    navigator.mediaSession.setActionHandler('play',()=>au.play());navigator.mediaSession.setActionHandler('pause',()=>au.pause())}}
function step(d){if(!queue.length)return;let n;
  if(shuf&&queue.length>1){do{n=queue[Math.floor(Math.random()*queue.length)]}while(n===cur)}
  else n=queue[(queue.indexOf(cur)+d+queue.length)%queue.length];play(n)}
function toggle(){if(!cur){startRandom();return}au.paused?au.play():au.pause()}
function startRandom(){if(!S.tracks.length)return;shuf=true;$('#shuf').classList.add('on');const a=S.tracks.map(t=>t.id);play(a[Math.floor(Math.random()*a.length)],a)}
au.onplay=au.onpause=()=>{const p=au.paused;document.body.classList.toggle('pause',p);$$('[data-act=pp] use').forEach(u=>u.setAttribute('href',p?'#i-play':'#i-pause'));if(!p)lyLoop()};
au.onended=()=>step(1);
au.onloadedmetadata=()=>{$('#du').textContent='-'+fmt(au.duration)};
const sk=$('#seek'),vl=$('#vol');
const paint=(e,v)=>e.style.setProperty('--p',v+'%');
sk.oninput=()=>{drag=true;paint(sk,sk.value);if(au.duration)au.currentTime=sk.value/100*au.duration};
sk.onchange=()=>{drag=false};
vl.oninput=()=>{au.volume=vl.value/100;paint(vl,vl.value)};paint(vl,100);
au.ontimeupdate=()=>{const t=au.currentTime,d=au.duration;$('#cu').textContent=fmt(t);
  if(d){$('#du').textContent='-'+fmt(d-t);const p=t/d*100;$('#mpb').style.width=p+'%';if(!drag){sk.value=p;paint(sk,p)}}
  lyTick()};
au.onseeked=lyTick;

(async()=>{
  await load();const s=S.set;document.title=s.name;
  $('#hlogo').innerHTML=s.logo?`<img src="${esc(s.logo)}" alt="">`:'';newsDot();
  $('#cr2').textContent=s.footer||'';
  if(S.preview)$('#prev').style.display='';
  rnd=shuffleArr(S.tracks.map(t=>t.id));
  $('#ttl').textContent=greet();$('#q').oninput({target:$('#q')});
  rHome();
})();
